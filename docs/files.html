ap you confirm that you own the target or hold explicit written\n> authorisation to test it. Scanning systems you do not own or are not\n> authorised to test may be illegal in your jurisdiction.\n\nThe CLI prints this notice on every run (suppress it with `--quiet`).\n\n---\n\n## Features\n\n1. Accepts a hostname or URL (e.g. `example.com` or `https://example.com/path`).\n2. Validates and normalises the target, rejecting malformed input.\n3. Performs DNS lookups for **A, AAAA, MX, NS, CNAME, TXT**.\n4. Makes a single, ordinary HTTP/HTTPS request and records the **status code,\n   redirect chain, response headers, content type** and explicit server /\n   application hints.\n5. Inspects **TLS metadata** for HTTPS: version, cipher, certificate subject,\n   issuer, expiry, and Subject Alternative Names.\n6. Builds a **relationship graph**: Domain -> DNS -> Web service -> TLS\n   certificate -> application metadata.\n7. Provides a clear **terminal output** and an optional **local web dashboard**.\n8. **Exports results to JSON** (and a one-row CSV summary).\n9. Handles timeouts, DNS failures, invalid URLs, TLS errors, redirects and\n   unavailable services gracefully.\n10. Keeps the architecture **modular** so additional safe application protocols\n    can be added later.\n\n---\n\n## Project structure\n\n```\nappmap/\n\u251c\u2500\u2500 appmap.py          # CLI entry point + pipeline orchestration + input validation\n\u251c\u2500\u2500 dns_analyzer.py    # DNS lookups (dnspython, with a stdlib fallback resolver)\n\u251c\u2500\u2500 http_analyzer.py   # single safe HTTP/HTTPS request + metadata\n\u251c\u2500\u2500 tls_analyzer.py    # TLS handshake + certificate metadata\n\u251c\u2500\u2500 graph.py           # relationship graph (nested dict, ASCII tree, nodes/edges)\n\u251c\u2500\u2500 exporter.py        # JSON / CSV export\n\u251c\u2500\u2500 dashboard.py       # web interface (Flask + single-page UI + JSON API)\n\u251c\u2500\u2500 requirements.txt\n\u251c\u2500\u2500 Dockerfile         # container image for hosting the interface\n\u251c\u2500\u2500 .dockerignore\n\u251c\u2500\u2500 Procfile           # for Heroku-style / gunicorn hosts\n\u251c\u2500\u2500 fly.toml           # Fly.io deployment config\n\u251c\u2500\u2500 railway.json       # Railway deployment config\n\u251c\u2500\u2500 .devcontainer/     # GitHub Codespaces setup (run the app, forward port 5000)\n\u251c\u2500\u2500 docs/              # GitHub Pages site + HOSTING.md\n\u251c\u2500\u2500 README.md\n\u251c\u2500\u2500 conftest.py        # makes the flat layout importable under pytest\n\u2514\u2500\u2500 tests/\n    \u251c\u2500\u2500 test_input.py\n    \u251c\u2500\u2500 test_dns.py\n    \u251c\u2500\u2500 test_http.py\n    \u251c\u2500\u2500 test_tls.py\n    \u251c\u2500\u2500 test_graph.py\n    \u251c\u2500\u2500 test_exporter.py\n    \u2514\u2500\u2500 test_pipeline.py\n```\n\n---\n\n## Installation\n\nRequires **Python 3.8+**. From inside the `appmap/` directory:\n\n```bash\n# (optional but recommended) create a virtual environment\npython3 -m venv .venv\nsource .venv/bin/activate      # Windows: .venv\\Scripts\\activate\n\n# install dependencies\npip install -r requirements.txt\n```\n\nThe core CLI works with the Python standard library alone. `requests` is used\nfor the HTTP step, `dnspython` enriches DNS lookups (a built-in fallback\nresolver is used automatically if it is not installed), and `Flask` is only\nneeded for the dashboard.\n\n---\n\n## Running the CLI\n\n```bash\npython appmap.py example.com\n```\n\nWrite full results to JSON and a CSV summary:\n\n```bash\npython appmap.py example.com --json results.json --csv summary.csv\n```\n\nOther options:\n\n| Flag | Meaning |\n| --- | --- |\n| `--json PATH` | write full results to a JSON file |\n| `--csv PATH` | write a one-row CSV summary |\n| `--output-dir DIR` | directory for exports (default: `.`) |\n| `--timeout SECONDS` | per-request timeout (default: `8`) |\n| `--no-http` | skip the HTTP request |\n| `--no-tls` | skip TLS inspection |\n| `--quiet` | suppress the authorisation notice |\n| `--version` | print the version |\n\n### Example output\n\n```\nAppMap\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nTarget: example.com\nURL:    https://example.com\n\nDNS\nA      93.184.216.34\nMX     0 .\nNS     a.iana-servers.net\nNS     b.iana-servers.net\n\nHTTP/HTTPS\nStatus: 200 OK\nFinal:  https://example.com/\nContent-Type: text/html; charset=UTF-8\nResponse time: 142.3 ms\n\nTLS\nVersion: TLS 1.3\nCipher:  TLS_AES_128_GCM_SHA256\nCertificate: CN=example.com\nIssuer:      DigiCert Inc\nExpires:     Oct 2 23:59:59 2026 GMT (365 days)\nSANs:        example.com, www.example.com\n\nAPPLICATION\nHTTP detected\nContent-Type: text/html; charset=UTF-8\n\nGraph:\nexample.com\n\u251c\u2500\u2500 DNS\n\u2502   \u251c\u2500\u2500 A 93.184.216.34\n\u2502   \u2514\u2500\u2500 NS a.iana-servers.net\n\u251c\u2500\u2500 HTTPS service\n\u2502   \u251c\u2500\u2500 Status 200 OK\n\u2502   \u2514\u2500\u2500 Content-Type: text/html; charset=UTF-8\n\u2514\u2500\u2500 TLS\n    \u251c\u2500\u2500 TLS 1.3\n    \u251c\u2500\u2500 subject CN=example.com\n    \u2514\u2500\u2500 issuer DigiCert Inc\n```\n\n---\n\n## Web interface\n\nThe interface is a single-page app served by Flask. It calls the exact same\npipeline as the CLI and shows a summary bar (target, HTTP status, TLS version,\ncertificate expiry), tables for DNS / HTTP / TLS, a relationship tree, and a\nraw-JSON panel with a one-click download.\n\n```bash\npython dashboard.py\n```\n\nThen open \u003chttp://127.0.0.1:5000> and enter a target. It binds to localhost only\nby default.\n\nA JSON API backs the interface and is available for scripting:\n\n```\nGET /api/scan?target=example.com    # full scan result as JSON\nGET /api/health                     # liveness probe\n```\n\nThere is also a standalone, offline preview of the interface with baked-in\nsample data: open `appmap-demo.html` in any browser - no server needed.\n\n---\n\n## Hosting the interface\n\n### Option A - run locally\n\n```bash\npython dashboard.py            # http://127.0.0.1:5000\n```\n\n### Option B - Docker (self-host anywhere)\n\n```bash\ndocker build -t appmap .\ndocker run -p 8000:8000 appmap   # then open http://127.0.0.1:8000\n```\n\nThe image runs behind **gunicorn**, not the Flask development server.\n\n### Option C - a managed host or Codespaces\n\nThis repo ships the configs these platforms expect (none of them is Render):\n\n- `.devcontainer/` -> **GitHub Codespaces**: run `python dashboard.py`, make port\n  5000 public, and get a live scanner URL - all inside GitHub.\n- `fly.toml` -> **Fly.io**: `fly launch --no-deploy && fly deploy`.\n- `railway.json` -> **Railway**: deploy from the GitHub repo; it builds the Dockerfile.\n- `Dockerfile` -> works on Fly, Railway, Koyeb, Hugging Face Spaces, Cloud Run,\n  or any VPS. It honours the host's `$PORT` and falls back to 8000.\n- `Procfile` -> Heroku-style hosts.\n- **No-account option:** run it locally and tunnel it -\n  `cloudflared tunnel --url http://localhost:5000` (or\n  `ssh -R 80:localhost:5000 nokey@localhost.run`) prints a public https URL.\n\nSee **[docs/HOSTING.md](docs/HOSTING.md)** for step-by-step instructions.\n\n> **Note on hosting:** a public deployment is reachable by anyone, so only\ndeploy it where you intend to offer it, and keep the authorisation notice in\nplace. Because AppMap makes outbound requests on behalf of whoever submits a\ntarget, some shared hosts block outbound DNS - the HTTP step will still work\nthrough an HTTP proxy, but DNS/TLS may report \"unavailable\" there.\n\n### Running behind gunicorn manually\n\n```bash\ngunicorn -w 2 -b 0.0.0.0:8000 --timeout 60 dashboard:app\n```\n\n---\n\n## Programmatic use\n\n```python\nfrom appmap import scan\n\nresult = scan(\"example.com\")\nprint(result[\"dns\"][\"records\"][\"A\"])\nprint(result[\"graph_ascii\"])\n```\n\n---\n\n## Running the tests\n\n```bash\npython -m pytest -q\n```\n\nThe suite (49 tests) covers input validation, the DNS packet parser, HTTP\nmetadata extraction and error handling, TLS certificate helpers, graph\nconstruction/rendering, export, and the end-to-end pipeline. It uses stubs for\nall network calls, so it runs offline.\n\n---\n\n## Safety and engineering notes\n\n- **Ordinary requests only.** One HTTP request (plus normal redirect following)\n  and one TLS handshake per target, with a short pause between them.\n- **No offensive behaviour.** No port scanning, flooding, exploitation, brute\n  forcing, credential testing, or access-control bypass.\n- **Timeouts everywhere.** Every network call has a conservative timeout.\n- **Graceful failure.** DNS failures, invalid URLs, TLS errors, redirects and\n  unreachable services are recorded as notes rather than crashing the run.\n- **Input validation.** Targets are validated and normalised before any request.\n- **Modular design.** Each analyzer is an independent class with a single\n  `analyze()` entry point, so new safe application protocols (e.g. a plain\n  HTTPS `HEAD` probe, a `robots.txt` fetch) can be added without touching the\n  rest of the pipeline.\n\n---\n\n## Limitations\n\n- AppMap reports only what a service **publicly exposes**; absence of a hint\n  does not mean absence of a service.\n- TLS inspection connects to port 443 by default.\n- DNS lookups require outbound DNS access from the machine running AppMap.\n", "size": 9650}, {"path": "appmap.py", "content": "#!/usr/bin/env python3\n\"\"\"appmap.py - AppMap: safe OSI Layer 7 service & metadata discovery.\n\nAppMap is a *defensive* tool. Given a hostname or URL that you own or are\nexplicitly authorised to test, it gathers publicly exposed application-layer\nmetadata: DNS records, a normal HTTP/HTTPS response, TLS certificate details,\nand a relationship graph of what it found.\n\nIt deliberately does NOT perform port scanning, packet flooding, exploitation,\nbrute forcing, credential testing, vulnerability exploitation, or any attempt to\nbypass authentication, rate limits, WAFs, CAPTCHAs or access controls. Only\nordinary, low-rate requests are made.\n\nUsage:\n    python appmap.py example.com\n    python appmap.py https://example.com --json out.json\n\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport re\nimport sys\nimport time\nfrom datetime import datetime, timezone\nfrom urllib.parse import urlparse\n\nfrom dns_analyzer import DNSAnalyzer\nfrom exporter import Exporter\nfrom graph import GraphBuilder\nfrom http_analyzer import HTTPAnalyzer\nfrom tls_analyzer import TLSAnalyzer\n\n__version__ = \"1.0.0\"\n\nAUTHORIZATION_NOTICE = \"\"\"\\\nAppMap - application-layer discovery (defensive use only)\n=========================================================\nBy using AppMap you confirm you own the target or have explicit written\nauthorisation to test it. AppMap makes only ordinary, low-rate requests and\nnever attempts exploitation, brute forcing, credential attacks, or any attempt\nto bypass access controls.\n\"\"\"\n\n# Conservative defaults: one request per endpoint, with a small pause between\n# the HTTP and TLS steps so we never look like a scanner hammering a host.\nDEFAULT_TIMEOUT = 8.0\nINTER_REQUEST_DELAY = 0.5\n\n_HOSTNAME_RE = re.compile(\n    r\"^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?\u003c!-)\"\n    r\"(?:\\.(?!-)[A-Za-z0-9-]{1,63}(?\u003c!-))*\\.?$\"\n)\n_IP_RE = re.compile(r\"^(\\d{1,3}\\.){3}\\d{1,3}$\")\n\n\nclass InputError(ValueError):\n    \"\"\"Raised when the user-supplied target cannot be understood.\"\"\"\n\n\ndef parse_target(raw: str) -> dict:\n    \"\"\"Validate and normalise a hostname or URL.\n\n    Returns a dict with ``hostname``, ``url`` and ``scheme``. Raises\n    :class:`InputError` on anything invalid so callers can fail gracefully.\n    \"\"\"\n    if raw is None:\n        raise InputError(\"no target supplied\")\n    target = raw.strip()\n    if not target:\n        raise InputError(\"target is empty\")\n    if len(target) > 2048:\n        raise InputError(\"target is unreasonably long\")\n    if any(ch in target for ch in (\" \", \"\\t\", \"\\n\", \"\\r\")):\n        raise InputError(\"target contains whitespace\")\n    # Strip a trailing path/query defensively if a bare hostname was given.\n    scheme = \"https\"\n    if \"://\" in target:\n        parsed = urlparse(target)\n        if parsed.scheme not in (\"http\", \"https\"):\n            raise InputError(f\"unsupported scheme: {parsed.scheme!r}\")\n        hostname = parsed.hostname\n        scheme = parsed.scheme\n        if not hostname:\n            raise InputError(\"could not extract a hostname from the URL\")\n        url = target\n    else:\n        # bare host, optionally with a path like example.com/foo\n        hostname = target.split(\"/\", 1)[0]\n        path = target[len(hostname):]\n        url = f\"{scheme}://{hostname}{path}\"\n\n    if not _HOSTNAME_RE.match(hostname) and not _IP_RE.match(hostname):\n        raise InputError(f\"invalid hostname: {hostname!r}\")\n    if _IP_RE.match(hostname):\n        for octet in hostname.split(\".\"):\n            if int(octet) > 255:\n                raise InputError(f\"invalid IPv4 address: {hostname!r}\")\n    return {\"hostname\": hostname.rstrip(\".\"), \"url\": url, \"scheme\": scheme}\n\n\ndef scan(\n    raw_target: str,\n    *,\n    timeout: float = DEFAULT_TIMEOUT,\n    do_http: bool = True,\n    do_tls: bool = True,\n    record_types=None,\n) -> dict:\n    \"\"\"Run the full AppMap pipeline for one target and return a result dict.\n\n    This is the single entry point reused by both the CLI and the dashboard.\n    \"\"\"\n    parsed = parse_target(raw_target)\n    hostname = parsed[\"hostname\"]\n    url = parsed[\"url\"]\n\n    result: dict = {\n        \"tool\": \"AppMap\",\n        \"version\": __version__,\n        \"target\": hostname,\n        \"url\": url,\n        \"scanned_at\": datetime.now(timezone.utc).isoformat(),\n        \"authorized_use_only\": True,\n        \"dns\": None,\n        \"http\": None,\n        \"tls\": None,\n        \"graph\": None,\n    }\n\n    # --- DNS -------------------------------------------------------------\n    dns_analyzer = DNSAnalyzer(timeout=timeout)\n    dns_result = dns_analyzer.analyze(hostname, record_types=record_types)\n    result[\"dns\"] = dns_result.as_dict()\n\n    # --- HTTP ------------------------------------------------------------\n    http_result = None\n    if do_http:\n        http_analyzer = HTTPAnalyzer(timeout=timeout)\n        http_result = http_analyzer.analyze(url)\n        result[\"http\"] = http_result.as_dict()\n        if do_tls:\n            time.sleep(INTER_REQUEST_DELAY)  # gentle pacing between requests\n\n    # --- TLS -------------------------------------------------------------\n    tls_result = None\n    if do_tls:\n        tls_analyzer = TLSAnalyzer(timeout=timeout)\n        tls_result = tls_analyzer.analyze(hostname, port=443)\n        result[\"tls\"] = tls_result.as_dict()\n\n    # --- Graph -----------------------------------------------------------\n    builder = GraphBuilder(hostname, dns_result, http_result, tls_result)\n    result[\"graph\"] = builder.build()\n    result[\"graph_ascii\"] = GraphBuilder.render_ascii(result[\"graph\"])\n    return result\n\n\n# --------------------------------------------------------------------------- #\n# Terminal rendering\n# --------------------------------------------------------------------------- #\ndef _hr(char: str = \"-\", width: int = 40) -> str:\n    return char * width\n\n\ndef render_terminal(result: dict) -> str:\n    out: list[str] = []\n    out.append(\"AppMap\")\n    out.append(\"\u2500\" * 40)\n    out.append(f\"Target: {result['target']}\")\n    out.append(f\"URL:    {result['url']}\")\n    out.append(\"\")\n\n    dns = result.get(\"dns\") or {}\n    out.append(\"DNS\")\n    records = dns.get(\"records\", {})\n    any_records = False\n    for rtype in (\"A\", \"AAAA\", \"MX\", \"NS\", \"CNAME\", \"TXT\"):\n        values = records.get(rtype) or []\n        for i, value in enumerate(values):\n            label = rtype if i == 0 else \"\"\n            out.append(f\"{label:\u003c6} {value}\")\n            any_records = True\n    if not any_records:\n        out.append(\"(no records resolved)\")\n    out.append(\"\")\n\n    http = result.get(\"http\")\n    if http is not None:\n        out.append(\"HTTP/HTTPS\")\n        if http.get(\"ok\"):\n            out.append(f\"Status: {http.get('status_code')} {http.get('reason') or ''}\".rstrip())\n            if http.get(\"final_url\"):\n                out.append(f\"Final:  {http['final_url']}\")\n            if len(http.get(\"redirect_chain\", [])) > 1:\n                out.append(\"Redirects:\")\n                for hop in http[\"redirect_chain\"]:\n                    arrow = f\" -> {hop['location']}\" if hop.get(\"location\") else \"\"\n                    out.append(f\"  {hop['status_code']} {hop['url']}{arrow}\")\n            if http.get(\"content_type\"):\n                out.append(f\"Content-Type: {http['content_type']}\")\n            if http.get(\"server\"):\n                out.append(f\"Server: {http['server']}\")\n            for name, value in (http.get(\"hints\") or {}).items():\n                if name == \"Server\":\n                    continue\n                out.append(f\"{name}: {value}\")\n            if http.get(\"elapsed_ms\") is not None:\n                out.append(f\"Response time: {http['elapsed_ms']} ms\")\n        else:\n            out.append(f\"Unavailable: {http.get('error')}\")\n        out.append(\"\")\n\n    tls = result.get(\"tls\")\n    if tls is not None:\n        out.append(\"TLS\")\n        if tls.get(\"connected\"):\n            out.append(f\"Version: {tls.get('tls_version') or 'unknown'}\")\n            if tls.get(\"cipher\"):\n                out.append(f\"Cipher:  {tls['cipher']}\")\n            subj = tls.get(\"subject\") or {}\n            iss = tls.get(\"issuer\") or {}\n            if subj:\n                out.append(f\"Certificate: CN={subj.get('commonName', '?')}\")\n            if iss:\n                out.append(\n                    \"Issuer:      \"\n                    + (iss.get(\"organizationName\") or iss.get(\"commonName\") or \"?\")\n                )\n            if tls.get(\"not_after\"):\n                days = tls.get(\"days_until_expiry\")\n                suffix = f\" ({days} days)\" if days is not None else \"\"\n                out.append(f\"Expires:     {tls['not_after']}{suffix}\")\n            if tls.get(\"sans\"):\n                out.append(f\"SANs:        {', '.join(tls['sans'][:8])}\"\n                           + (\" ...\" if len(tls[\"sans\"]) > 8 else \"\"))\n            if tls.get(\"verified\") is False:\n                out.append(\"Note:        certificate did not verify (metadata shown unverified)\")\n            if tls.get(\"error\"):\n                out.append(f\"Note:        {tls['error']}\")\n        else:\n            out.append(f\"Unavailable: {tls.get('error')}\")\n        out.append(\"\")\n\n    out.append(\"APPLICATION\")\n    http = result.get(\"http\") or {}\n    if http.get(\"ok\"):\n        out.append(\"HTTP detected\")\n        if http.get(\"content_type\"):\n            out.append(f\"Content-Type: {http['content_type']}\")\n    else:\n        out.append(\"No HTTP service metadata available\")\n    out.append(\"\")\n\n    out.append(\"Graph:\")\n    out.append(result.get(\"graph_ascii\", \"\"))\n    return \"\\n\".join(out)\n\n\n# --------------------------------------------------------------------------- #\n# CLI\n# --------------------------------------------------------------------------- #\ndef build_arg_parser() -> argparse.ArgumentParser:\n    parser = argparse.ArgumentParser(\n        prog=\"appmap\",\n        description=\"AppMap - safe OSI Layer 7 service and metadata discovery \"\n                    \"(defensive use only).\",\n        epilog=\"Example: python appmap.py example.com --json out.json\",\n    )\n    parser.add_argument(\"target\", help=\"hostname or URL, e.g. example.com\")\n    parser.add_argument(\"--json\", metavar=\"PATH\", help=\"write full results to a JSON file\")\n    parser.add_argument(\"--csv\", metavar=\"PATH\", help=\"write a one-row CSV summary\")\n    parser.add_argument(\"--output-dir\", default=\".\", help=\"directory for exports (default: .)\")\n    parser.add_argument(\"--timeout\", type=float, default=DEFAULT_TIMEOUT,\n                        help=f\"per-request timeout in seconds (default: {DEFAULT_TIMEOUT})\")\n    parser.add_argument(\"--no-http\", action=\"store_true\", help=\"skip the HTTP request\")\n    parser.add_argument(\"--no-tls\", action=\"store_true\", help=\"skip the TLS inspection\")\n    parser.add_argument(\"--quiet\", action=\"store_true\", help=\"suppress the authorization notice\")\n    parser.add_argument(\"--version\", action=\"version\", version=f\"AppMap {__version__}\")\n    return parser\n\n\ndef main(argv=None) -> int:\n    parser = build_arg_parser()\n    args = parser.parse_args(argv)\n\n    if not args.quiet:\n        print(AUTHORIZATION_NOTICE)\n\n    try:\n        parsed = parse_target(args.target)\n    except InputError as exc:\n        print(f\"error: {exc}\", file=sys.stderr)\n        return 2\n\n    try:\n        result = scan(\n            args.target,\n            timeout=args.timeout,\n            do_http=not args.no_http,\n            do_tls=not args.no_tls,\n        )\n    except KeyboardInterrupt:\n        print(\"\\ninterrupted\", file=sys.stderr)\n        return 130\n    except Exception as exc:  # pragma: no cover - last-resort guard\n        print(f\"error: unexpected failure: {type(exc).__name__}: {exc}\", file=sys.stderr)\n        return 1\n\n    print(render_terminal(result))\n\n    exporter = Exporter(output_dir=args.output_dir)\n    if args.json:\n        path = exporter.export_json(result, args.json)\n        print(f\"\\nJSON written to {path}\")\n    if args.csv:\n        path = exporter.export_csv_summary(result, args.csv)\n        print(f\"CSV summary written to {path}\")\n\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "size": 12030}, {"path": "conftest.py", "content": "\"\"\"Pytest configuration: make the project root importable as a flat package.\"\"\"\nimport os\nimport sys\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n", "size": 182}, {"path": "dashboard.py", "content": "\"\"\"dashboard.py - AppMap's local web interface.\n\nRun it with:   python dashboard.py\nOpen:          http://127.0.0.1:5000\n\nThe server exposes:\n    GET /                 the single-page interface\n    GET /api/scan?target= JSON scan result (same pipeline as the CLI)\n    GET /api/health       liveness probe (used by hosting platforms)\n\nFor hosting behind a real server, run it with gunicorn:\n    gunicorn -w 2 -b 0.0.0.0:8000 dashboard:app\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\n\nfrom flask import Flask, Response, jsonify, request\n\nfrom appmap import InputError, __version__, parse_target, scan\n\napp = Flask(__name__)\n\n# When hosted, allow overriding the bind address via environment variables.\nHOST = os.environ.get(\"APPMAP_HOST\", \"127.0.0.1\")\nPORT = int(os.environ.get(\"APPMAP_PORT\", \"5000\"))\n\n\n_INDEX_HTML = \"\"\"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>AppMap - application-layer discovery\u003c/title>\n\u003cstyle>\n  :root {\n    --bg:#0b0e13; --panel:#141821; --panel2:#1b212c; --line:#2a3140;\n    --fg:#e8ecf3; --muted:#93a0b4; --accent:#4da3ff; --accent2:#7c5cff;\n    --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b;\n  }\n  * { box-sizing: border-box; }\n  html,body { margin:0; padding:0; }\n  body {\n    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;\n    background: radial-gradient(1200px 600px at 70% -10%, #16233a 0%, var(--bg) 55%);\n    color: var(--fg); min-height:100vh; -webkit-font-smoothing:antialiased;\n  }\n  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }\n  a { color: var(--accent); }\n  header {\n    padding: 26px 28px 18px; border-bottom:1px solid var(--line);\n    display:flex; align-items:center; gap:14px; flex-wrap:wrap;\n    background: rgba(11,14,19,.6); backdrop-filter: blur(8px);\n    position: sticky; top:0; z-index:5;\n  }\n  .logo {\n    width:38px; height:38px; border-radius:10px; flex:0 0 auto;\n    background: linear-gradient(135deg, var(--accent), var(--accent2));\n    display:grid; place-items:center; font-weight:800; color:#05121f; font-size:18px;\n  }\n  header h1 { margin:0; font-size:19px; letter-spacing:.3px; }\n  header .sub { color:var(--muted); font-size:12.5px; margin-top:2px; }\n  .badge { font-size:11px; color:var(--muted); border:1px solid var(--line);\n    padding:2px 9px; border-radius:20px; margin-left:8px; }\n  main { max-width:1080px; margin:0 auto; padding:26px 20px 80px; }\n  .search { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }\n  .search .field { flex:1; min-width:240px; position:relative; }\n  .search input {\n    width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line);\n    background:var(--panel); color:var(--fg); font-size:15px; outline:none;\n    transition:border-color .15s, box-shadow .15s;\n  }\n  .search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(77,163,255,.15); }\n  .search button {\n    padding:14px 22px; border-radius:12px; border:none; cursor:pointer; font-size:15px;\n    font-weight:600; color:#04121f; background:linear-gradient(135deg,var(--accent),#5fb0ff);\n    transition:transform .08s, filter .15s;\n  }\n  .search button:hover { filter:brightness(1.06); }\n  .search button:active { transform:translateY(1px); }\n  .search button:disabled { opacity:.6; cursor:default; }\n  .notice { color:var(--muted); font-size:12px; line-height:1.6; margin:6px 2px 22px; }\n  .notice b { color:var(--warn); font-weight:600; }\n  .empty { text-align:center; color:var(--muted); padding:60px 20px; }\n  .empty .big { font-size:44px; margin-bottom:10px; opacity:.5; }\n  .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.3);\n    border-top-color:#04121f; border-radius:50%; display:inline-block;\n    animation:spin .7s linear infinite; vertical-align:-2px; }\n  @keyframes spin { to { transform:rotate(360deg); } }\n  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:20px; }\n  .stat { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }\n  .stat .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; }\n  .stat .v { font-size:20px; margin-top:6px; font-weight:600; word-break:break-word; }\n  .stat .v.ok { color:var(--ok); } .stat .v.warn { color:var(--warn); } .stat .v.bad { color:var(--bad); }\n  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;\n    padding:18px 20px; margin-bottom:16px; }\n  .card > h2 { margin:0 0 14px; font-size:12px; text-transform:uppercase; letter-spacing:1.4px;\n    color:var(--accent); display:flex; align-items:center; gap:8px; }\n  .card > h2 .count { color:var(--muted); font-weight:400; letter-spacing:0; text-transform:none; }\n  table.kv { width:100%; border-collapse:collapse; font-size:13.5px; }\n  table.kv td { padding:7px 0; border-bottom:1px solid rgba(42,49,64,.55); vertical-align:top; }\n  table.kv tr:last-child td { border-bottom:none; }\n  table.kv td:first-child { color:var(--muted); width:190px; padding-right:14px; }\n  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:6px;\n    background:var(--panel2); border:1px solid var(--line); color:var(--muted); margin-right:6px; }\n  .tag.a { color:#7fd0ff; } .tag.aaaa { color:#b8a6ff; } .tag.mx { color:#ffc98a; }\n  .tag.ns { color:#9be6c4; } .tag.txt { color:#e6b8ff; } .tag.cname { color:#ffb0c8; }\n  ul.tree { list-style:none; margin:0; padding-left:20px; }\n  ul.tree.root { padding-left:2px; }\n  ul.tree li { position:relative; padding:3px 0 3px 18px; font-size:13.5px; }\n  ul.tree li::before { content:\"\"; position:absolute; left:0; top:0; bottom:0;\n    border-left:1px solid var(--line); }\n  ul.tree li:last-child::before { bottom:auto; height:16px; }\n  ul.tree li::after { content:\"\"; position:absolute; left:0; top:16px; width:12px;\n    border-top:1px solid var(--line); }\n  ul.tree.root > li { padding-left:0; }\n  ul.tree.root > li::before, ul.tree.root > li::after { display:none; }\n  .node-type { font-size:10.5px; color:var(--muted); margin-left:8px; }\n  .json-head { display:flex; justify-content:space-between; align-items:center; }\n  .btn-ghost { background:var(--panel2); border:1px solid var(--line); color:var(--fg);\n    padding:7px 14px; border-radius:9px; cursor:pointer; font-size:12.5px; }\n  .btn-ghost:hover { border-color:var(--accent); }\n  pre.json { max-height:420px; overflow:auto; background:#0d1017; border:1px solid var(--line);\n    border-radius:10px; padding:14px; font-size:12.5px; line-height:1.5; margin:14px 0 0; }\n  .alert { border-radius:12px; padding:14px 16px; font-size:13.5px; margin-bottom:16px; }\n  .alert.err { background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.4); color:#ffb3b3; }\n  footer { text-align:center; color:var(--muted); font-size:11.5px; padding:30px 20px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"logo\">A\u003c/div>\n  \u003cdiv>\n    \u003ch1>AppMap \u003cspan class=\"badge\">v__VERSION__\u003c/span>\u003c/h1>\n    \u003cdiv class=\"sub\">Safe OSI Layer 7 service &amp; metadata discovery\u003c/div>\n  \u003c/div>\n\u003c/header>\n\u003cmain>\n  \u003cform class=\"search\" id=\"form\">\n    \u003cdiv class=\"field\">\n      \u003cinput id=\"target\" name=\"target\" type=\"text\" placeholder=\"example.com  or  https://example.com/path\"\n             autocomplete=\"off\" spellcheck=\"false\" autofocus>\n    \u003c/div>\n    \u003cbutton id=\"go\" type=\"submit\">Map it\u003c/button>\n  \u003c/form>\n  \u003cp class=\"notice\">\n    \u003cb>Defensive use only.\u003c/b> Scan only hosts you own or are explicitly authorised to test.\n    AppMap makes ordinary, low-rate requests and never attempts exploitation, brute forcing,\n    credential attacks, or bypassing access controls.\n  \u003c/p>\n  \u003cdiv id=\"out\">\u003cdiv class=\"empty\">\u003cdiv class=\"big\">&#9783;\u003c/div>\n    Enter a hostname or URL to map its application-layer services.\u003c/div>\u003c/div>\n\u003c/main>\n\u003cfooter>AppMap v__VERSION__ &middot; results are informational and reflect only what a service publicly exposes.\u003c/footer>\n\u003cscript>\nconst $ = (s) => document.querySelector(s);\nconst esc = (s) => String(s == null ? \"\" : s).replace(/[&\u003c>\"']/g,\n  c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst out = $(\"#out\");\nlet lastResult = null;\n\n$(\"#form\").addEventListener(\"submit\", async (e) => {\n  e.preventDefault();\n  const target = $(\"#target\").value.trim();\n  if (!target) return;\n  const btn = $(\"#go\");\n  btn.disabled = true;\n  btn.innerHTML = '\u003cspan class=\"spinner\">\u003c/span> Mapping';\n  out.innerHTML = '\u003cdiv class=\"empty\">Contacting the target and collecting metadata&hellip;\u003c/div>';\n  try {\n    const res = await fetch(\"/api/scan?target=\" + encodeURIComponent(target));\n    const data = await res.json();\n    if (!res.ok || data.error) { renderError(data.error || (\"HTTP \" + res.status)); }\n    else { lastResult = data; render(data); }\n  } catch (err) {\n    renderError(\"Request failed: \" + err.message);\n  } finally {\n    btn.disabled = false;\n    btn.textContent = \"Map it\";\n  }\n});\n\nfunction renderError(msg) {\n  out.innerHTML = '\u003cdiv class=\"alert err\">\u003cb>Could not map target.\u003c/b>\u003cbr>' + esc(msg) + '\u003c/div>';\n}\n\nfunction tagFor(t) { return '\u003cspan class=\"tag ' + esc((t||\"\").toLowerCase()) + '\">' + esc(t) + '\u003c/span>'; }\n\nfunction render(d) {\n  const dns = d.dns || {}, http = d.http || {}, tls = d.tls || {};\n  const records = dns.records || {};\n\n  // ---- summary stat cards ----\n  const statusVal = http.ok ? (http.status_code + \" \" + (http.reason||\"\")).trim() : \"unreachable\";\n  const statusCls = http.ok ? (http.status_code \u003c 400 ? \"ok\" : \"warn\") : \"bad\";\n  const tlsCls = tls.connected ? \"ok\" : \"bad\";\n  let expCls = \"\", expVal = \"n/a\";\n  if (tls.not_after) {\n    expVal = (tls.days_until_expiry != null ? tls.days_until_expiry + \" days\" : \"unknown\");\n    expCls = tls.days_until_expiry != null && tls.days_until_expiry \u003c 14 ? \"warn\" : \"ok\";\n  }\n  const aCount = (records.A||[]).length;\n  let html = '\u003cdiv class=\"cards\">'\n    + stat(\"Target\", d.target, \"\")\n    + stat(\"HTTP status\", statusVal, statusCls)\n    + stat(\"TLS\", tls.tls_version || (tls.connected ? \"connected\" : \"n/a\"), tlsCls)\n    + stat(\"Cert expiry\", expVal, expCls)\n    + '\u003c/div>';\n\n  // ---- DNS ----\n  let dnsRows = \"\";\n  const order = [\"A\",\"AAAA\",\"MX\",\"NS\",\"CNAME\",\"TXT\"];\n  order.forEach(function (t) {\n    (records[t]||[]).forEach(function (v) { dnsRows += kvRow(tagFor(t), esc(v)); });\n  });\n  if (!dnsRows) dnsRows = kvRow('\u003cspan class=\"tag\">none\u003c/span>', '\u003cspan style=\"color:var(--muted)\">no records resolved\u003c/span>');\n  html += card(\"DNS records\", dnsRows + dnsErrors(dns.errors));\n\n  // ---- HTTP ----\n  const httpRows =\n      kvRow(\"Status\", esc(http.ok ? ((http.status_code + \" \" + (http.reason||\"\")).trim()) : (http.error||\"unavailable\")))\n    + kvRow(\"Final URL\", esc(http.final_url))\n    + kvRow(\"Content-Type\", esc(http.content_type))\n    + kvRow(\"Server\", esc(http.server))\n    + kvRow(\"Response time\", http.elapsed_ms != null ? esc(http.elapsed_ms) + \" ms\" : \"\")\n    + Object.keys(http.hints||{}).filter(k => k !== \"Server\").map(k => kvRow(esc(k), esc(http.hints[k]))).join(\"\")\n    + redirects(http.redirect_chain);\n  html += card(\"HTTP / HTTPS\", httpRows);\n\n  // ---- TLS ----\n  const subj = tls.subject||{}, iss = tls.issuer||{};\n  const tlsRows =\n      kvRow(\"Version\", esc(tls.tls_version))\n    + kvRow(\"Cipher\", esc(tls.cipher))\n    + kvRow(\"Subject\", esc(subj.commonName))\n    + kvRow(\"Issuer\", esc(iss.organizationName || iss.commonName))\n    + kvRow(\"Valid from\", esc(tls.not_before))\n    + kvRow(\"Expires\", esc(tls.not_after) + (tls.days_until_expiry != null ? ' \u003cspan class=\"node-type\">(' + esc(tls.days_until_expiry) + ' days)\u003c/span>' : \"\"))\n    + kvRow(\"SANs\", (tls.sans||[]).map(s => '\u003cspan class=\"tag\">' + esc(s) + '\u003c/span>').join(\" \"))\n    + kvRow(\"Verified\", tls.verified === true ? '\u003cspan style=\"color:var(--ok)\">yes\u003c/span>' : (tls.verified === false ? '\u003cspan style=\"color:var(--warn)\">no\u003c/span>' : \"\"))\n    + kvRow(\"Note\", esc(tls.error));\n  html += card(\"TLS certificate\", tlsRows);\n\n  // ---- Graph ----\n  html += '\u003cdiv class=\"card\">\u003ch2>Relationship graph\u003c/h2>'\n        + '\u003cul class=\"tree root\">' + tree(d.graph) + '\u003c/ul>\u003c/div>';\n\n  // ---- JSON ----\n  html += '\u003cdiv class=\"card\">\u003cdiv class=\"json-head\">\u003ch2 style=\"margin:0\">Raw JSON\u003c/h2>'\n        + '\u003cbutton class=\"btn-ghost\" id=\"dl\">Download JSON\u003c/button>\u003c/div>'\n        + '\u003cpre class=\"json\">' + esc(JSON.stringify(d, null, 2)) + '\u003c/pre>\u003c/div>';\n\n  out.innerHTML = html;\n  const dl = $(\"#dl\");\n  if (dl) dl.addEventListener(\"click\", downloadJson);\n}\n\nfunction stat(k, v, cls) {\n  return '\u003cdiv class=\"stat\">\u003cdiv class=\"k\">' + esc(k) + '\u003c/div>\u003cdiv class=\"v ' + cls + '\">' + esc(v) + '\u003c/div>\u003c/div>';\n}\nfunction card(title, inner) { return '\u003cdiv class=\"card\">\u003ch2>' + esc(title) + '\u003c/h2>\u003ctable class=\"kv\">' + inner + '\u003c/table>\u003c/div>'; }\nfunction kvRow(k, v) { if (v === \"\" || v == null) return \"\"; return '\u003ctr>\u003ctd>' + k + '\u003c/td>\u003ctd>' + v + '\u003c/td>\u003c/tr>'; }\nfunction dnsErrors(errs) {\n  if (!errs || !errs.length) return \"\";\n  return kvRow(\"Notes\", '\u003cspan style=\"color:var(--muted)\">' + esc(errs.slice(0,6).join(\"; \")) + '\u003c/span>');\n}\nfunction redirects(chain) {\n  if (!chain || chain.length \u003c 2) return \"\";\n  const hops = chain.map(h => esc(h.status_code) + \" \" + esc(h.url) + (h.location ? \" &rarr; \" + esc(h.location) : \"\")).join(\"\u003cbr>\");\n  return kvRow(\"Redirects\", hops);\n}\nfunction tree(node) {\n  if (!node) return \"\";\n  const kids = node.children || [];\n  const label = esc(node.name) + (node.type && node.type !== \"domain\" && node.type !== \"dns\" ? '\u003cspan class=\"node-type\">' + esc(node.type) + '\u003c/span>' : \"\");\n  return \"\u003cli>\" + label + (kids.length ? '\u003cul class=\"tree\">' + kids.map(tree).join(\"\") + \"\u003c/ul>\" : \"\") + \"\u003c/li>\";\n}\nfunction downloadJson() {\n  if (!lastResult) return;\n  const blob = new Blob([JSON.stringify(lastResult, null, 2)], {type:\"application/json\"});\n  const a = document.createElement(\"a\");\n  a.href = URL.createObjectURL(blob);\n  a.download = \"appmap_\" + (lastResult.target||\"target\").replace(/[^a-z0-9.-]/gi,\"_\") + \".json\";\n  document.body.appendChild(a); a.click(); a.remove();\n  URL.revokeObjectURL(a.href);\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n\"\"\"\n\n\n@app.route(\"/\", methods=[\"GET\"])\ndef index() -> Response:\n    return Response(_INDEX_HTML.replace(\"__VERSION__\", __version__), mimetype=\"text/html\")\n\n\n@app.route(\"/api/scan\", methods=[\"GET\"])\ndef api_scan():\n    \"\"\"JSON API mirroring the CLI, used by the interface and by scripts.\"\"\"\n    target = (request.args.get(\"target\") or \"\").strip()\n    if not target:\n        return jsonify({\"error\": \"missing 'target' query parameter\"}), 400\n    try:\n        parse_target(target)\n    except InputError as exc:\n        return jsonify({\"error\": str(exc)}), 400\n    try:\n        result = scan(target)\n    except Exception as exc:  # pragma: no cover - defensive\n        return jsonify({\"error\": f\"{type(exc).__name__}: {exc}\"}), 500\n    return jsonify(result)\n\n\n@app.route(\"/api/health\", methods=[\"GET\"])\ndef api_health():\n    return jsonify({\"status\": \"ok\", \"tool\": \"AppMap\", \"version\": __version__})\n\n\ndef main() -> None:\n    print(f\"AppMap interface running at http://{HOST}:{PORT}  (Ctrl+C to stop)\")\n    print(\"Defensive use only - scan hosts you own or are authorised to test.\")\n    app.run(host=HOST, port=PORT, debug=False)\n\n\nif __name__ == \"__main__\":\n    main()\n", "size": 15298}, {"path": "dns_analyzer.py", "content": "\"\"\"dns_analyzer.py - safe, read-only DNS lookups for AppMap.\n\nOnly ordinary recursive DNS queries (A, AAAA, MX, NS, CNAME, TXT) are issued.\nIf the third-party ``dnspython`` package is available it is used; otherwise a\nsmall, self-contained standard-library resolver is used so AppMap keeps working\nwith no external dependencies.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport ipaddress\nimport random\nimport socket\nimport struct\nfrom dataclasses import dataclass, field\nfrom typing import Dict, List, Optional\n\ntry:  # optional dependency\n    import dns.resolver  # type: ignore\n    import dns.exception  # type: ignore\n\n    _HAVE_DNSPYTHON = True\nexcept Exception:  # pragma: no cover - exercised only when dnspython is absent\n    _HAVE_DNSPYTHON = False\n\n\n# Record type -> numeric code, for the built-in resolver.\n_RECORD_TYPES = {\n    \"A\": 1,\n    \"NS\": 2,\n    \"CNAME\": 5,\n    \"MX\": 15,\n    \"TXT\": 16,\n    \"AAAA\": 28,\n}\n\n# Query order used for the CLI / graph.\nRECORD_ORDER = [\"A\", \"AAAA\", \"MX\", \"NS\", \"CNAME\", \"TXT\"]\n\n\nclass DNSLookupError(Exception):\n    \"\"\"Raised when a DNS lookup cannot be completed (non-fatal to AppMap).\"\"\"\n\n\n@dataclass\nclass DNSResult:\n    \"\"\"Container for all DNS records gathered for a single hostname.\"\"\"\n\n    hostname: str\n    records: Dict[str, List[str]] = field(default_factory=dict)\n    errors: List[str] = field(default_factory=list)\n    resolver: str = \"\"\n\n    def has_records(self) -> bool:\n        return any(self.records.values())\n\n    def as_dict(self) -> dict:\n        return {\n            \"hostname\": self.hostname,\n            \"resolver\": self.resolver,\n            \"records\": self.records,\n            \"errors\": self.errors,\n        }\n\n\n# --------------------------------------------------------------------------- #\n# Built-in, dependency-free resolver\n# --------------------------------------------------------------------------- #\nclass _MiniResolver:\n    \"\"\"A minimal UDP DNS client built on the standard library only.\n\n    It supports the record types AppMap needs and honours name compression in\n    responses. It is deliberately simple: one query per type, one retry, and a\n    short timeout. No recursion beyond the resolver is attempted.\n    \"\"\"\n\n    def __init__(self, nameserver: Optional[str] = None, timeout: float = 5.0):\n        self.timeout = timeout\n        self.nameserver = nameserver or self._system_nameserver()\n\n    @staticmethod\n    def _system_nameserver() -> str:\n        try:\n            with open(\"/etc/resolv.conf\", \"r\", encoding=\"utf-8\") as fh:\n                for line in fh:\n                    line = line.strip()\n                    if line.startswith(\"nameserver\"):\n                        parts = line.split()\n                        if len(parts) >= 2:\n                            return parts[1]\n        except OSError:\n            pass\n        return \"8.8.8.8\"\n\n    @staticmethod\n    def _encode_name(name: str) -> bytes:\n        out = b\"\"\n        for label in name.rstrip(\".\").split(\".\"):\n            encoded = label.encode(\"idna\") if label else b\"\"\n            out += struct.pack(\"!B\", len(encoded)) + encoded\n        return out + b\"\\x00\"\n\n    @staticmethod\n    def _decode_name(data: bytes, offset: int) -> tuple[str, int]:\n        labels: List[str] = []\n        jumped = False\n        next_offset = offset\n        safety = 0\n        while True:\n            safety += 1\n            if safety > 128:\n                raise DNSLookupError(\"malformed DNS name (loop detected)\")\n            if offset >= len(data):\n                raise DNSLookupError(\"truncated DNS name\")\n            length = data[offset]\n            if length == 0:\n                offset += 1\n                if not jumped:\n                    next_offset = offset\n                break\n            if length & 0xC0 == 0xC0:  # compression pointer\n                if offset + 1 >= len(data):\n                    raise DNSLookupError(\"truncated DNS pointer\")\n                pointer = ((length & 0x3F) \u003c\u003c 8) | data[offset + 1]\n                if not jumped:\n                    next_offset = offset + 2\n                offset = pointer\n                jumped = True\n                continue\n            offset += 1\n            labels.append(data[offset : offset + length].decode(\"latin-1\"))\n            offset += length\n        return \".\".join(labels), next_offset\n\n    def query(self, name: str, rtype: str) -> List[str]:\n        if rtype not in _RECORD_TYPES:\n            raise DNSLookupError(f\"unsupported record type: {rtype}\")\n\n        query_id = random.randint(0, 0xFFFF)\n        header = struct.pack(\"!HHHHHH\", query_id, 0x0100, 1, 0, 0, 0)\n        question = self._encode_name(name) + struct.pack(\n            \"!HH\", _RECORD_TYPES[rtype], 1\n        )\n        packet = header + question\n\n        last_error = \"no response\"\n        for _ in range(2):  # one retry\n            try:\n                answers = self._exchange(packet, query_id)\n                return answers\n            except DNSLookupError as exc:\n                last_error = str(exc)\n            except (socket.timeout, OSError) as exc:\n                last_error = f\"{type(exc).__name__}: {exc}\"\n        raise DNSLookupError(last_error)\n\n    def _exchange(self, packet: bytes, query_id: int) -> List[str]:\n        family = socket.AF_INET\n        try:\n            ipaddress.IPv6Address(self.nameserver)\n            family = socket.AF_INET6\n        except ValueError:\n            pass\n\n        sock = socket.socket(family, socket.SOCK_DGRAM)\n        sock.settimeout(self.timeout)\n        try:\n            sock.sendto(packet, (self.nameserver, 53))\n            data, _ = sock.recvfrom(4096)\n        finally:\n            sock.close()\n\n        return self._parse_response(data, query_id)\n\n    def _parse_response(self, data: bytes, query_id: int) -> List[str]:\n        if len(data) \u003c 12:\n            raise DNSLookupError(\"short DNS response\")\n        (resp_id, flags, qd, an, _ns, _ar) = struct.unpack(\"!HHHHHH\", data[:12])\n        if resp_id != query_id:\n            raise DNSLookupError(\"DNS response id mismatch\")\n        rcode = flags & 0x000F\n        if rcode == 3:\n            raise DNSLookupError(\"NXDOMAIN (name does not exist)\")\n        if rcode != 0:\n            raise DNSLookupError(f\"DNS server returned rcode {rcode}\")\n\n        offset = 12\n        for _ in range(qd):  # skip the question section\n            _, offset = self._decode_name(data, offset)\n            offset += 4\n\n        results: List[str] = []\n        for _ in range(an):\n            _, offset = self._decode_name(data, offset)\n            if offset + 10 > len(data):\n                break\n            rtype, _rclass, _ttl, rdlength = struct.unpack(\n                \"!HHIH\", data[offset : offset + 10]\n            )\n            offset += 10\n            rdata_start = offset\n            rdata_end = offset + rdlength\n\n            if rtype == 1 and rdlength == 4:\n                results.append(str(ipaddress.IPv4Address(data[rdata_start:rdata_end])))\n            elif rtype == 28 and rdlength == 16:\n                results.append(str(ipaddress.IPv6Address(data[rdata_start:rdata_end])))\n            elif rtype in (2, 5):  # NS, CNAME\n                target, _ = self._decode_name(data, rdata_start)\n                results.append(target)\n            elif rtype == 15:  # MX\n                if rdlength >= 3:\n                    pref = struct.unpack(\"!H\", data[rdata_start : rdata_start + 2])[0]\n                    exch, _ = self._decode_name(data, rdata_start + 2)\n                    results.append(f\"{pref} {exch}\")\n            elif rtype == 16:  # TXT\n                results.append(self._parse_txt(data, rdata_start, rdata_end))\n            offset = rdata_end\n        return results\n\n    @staticmethod\n    def _parse_txt(data: bytes, start: int, end: int) -> str:\n        chunks: List[str] = []\n        offset = start\n        while offset \u003c end:\n            length = data[offset]\n            offset += 1\n            chunks.append(data[offset : offset + length].decode(\"latin-1\"))\n            offset += length\n        return \"\".join(chunks)\n\n\n# --------------------------------------------------------------------------- #\n# Public API\n# --------------------------------------------------------------------------- #\nclass DNSAnalyzer:\n    \"\"\"Gathers A, AAAA, MX, NS, CNAME and TXT records for a hostname.\"\"\"\n\n    def __init__(self, timeout: float = 5.0):\n        self.timeout = timeout\n        self._mini = _MiniResolver(timeout=timeout)\n\n    @property\n    def backend(self) -> str:\n        return \"dnspython\" if _HAVE_DNSPYTHON else \"builtin\"\n\n    def analyze(self, hostname: str, record_types: Optional[List[str]] = None) -> DNSResult:\n        record_types = record_types or RECORD_ORDER\n        result = DNSResult(hostname=hostname, resolver=self.backend)\n        for rtype in record_types:\n            try:\n                values = self._lookup(hostname, rtype)\n            except DNSLookupError as exc:\n                # \"no records of this type\" is normal, not an error worth\n                # shouting about; record it for transparency.\n                result.errors.append(f\"{rtype}: {exc}\")\n                result.records[rtype] = []\n                continue\n            except Exception as exc:  # pragma: no cover - defensive\n                result.errors.append(f\"{rtype}: {type(exc).__name__}: {exc}\")\n                result.records[rtype] = []\n                continue\n            result.records[rtype] = values\n        return result\n\n    def _lookup(self, hostname: str, rtype: str) -> List[str]:\n        if _HAVE_DNSPYTHON:\n            return self._lookup_dnspython(hostname, rtype)\n        return self._mini.query(hostname, rtype)\n\n    def _lookup_dnspython(self, hostname: str, rtype: str) -> List[str]:\n        resolver = dns.resolver.Resolver()\n        resolver.timeout = self.timeout\n        resolver.lifetime = self.timeout\n        try:\n            answers = resolver.resolve(hostname, rtype, raise_on_no_answer=False)\n        except dns.resolver.NXDOMAIN as exc:\n            raise DNSLookupError(f\"NXDOMAIN: {exc}\") from exc\n        except dns.resolver.NoNameservers as exc:\n            raise DNSLookupError(f\"no nameservers: {exc}\") from exc\n        except dns.exception.Timeout as exc:\n            raise DNSLookupError(\"query timed out\") from exc\n        except dns.resolver.NoAnswer:\n            return []\n        except Exception as exc:\n            raise DNSLookupError(f\"{type(exc).__name__}: {exc}\") from exc\n\n        if answers.rrset is None:\n            return []\n\n        values: List[str] = []\n        for rdata in answers:\n            if rtype == \"MX\":\n                values.append(f\"{rdata.preference} {rdata.exchange.to_text(omit_final_dot=True)}\")\n            elif rtype in (\"NS\", \"CNAME\"):\n                values.append(rdata.target.to_text(omit_final_dot=True))\n            elif rtype == \"TXT\":\n                values.append(\"\".join(\n                    part.decode(\"latin-1\") if isinstance(part, bytes) else str(part)\n                    for part in rdata.strings\n                ))\n            else:\n                values.append(rdata.address if hasattr(rdata, \"address\") else rdata.to_text())\n        return values\n", "size": 11163}, {"path": "exporter.py", "content": "\"\"\"exporter.py - persist AppMap results to JSON (and a tiny CSV summary).\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport json\nimport os\nfrom datetime import datetime, timezone\nfrom typing import Optional\n\n\nclass Exporter:\n    \"\"\"Writes a scan result to disk. All output is plain, human-readable text.\"\"\"\n\n    def __init__(self, output_dir: str = \".\"):\n        self.output_dir = output_dir\n\n    def _ensure_dir(self) -> None:\n        if self.output_dir and not os.path.isdir(self.output_dir):\n            os.makedirs(self.output_dir, exist_ok=True)\n\n    def export_json(self, result: dict, path: Optional[str] = None) -> str:\n        self._ensure_dir()\n        if path is None:\n            stamp = datetime.now(timezone.utc).strftime(\"%Y%m%dT%H%M%SZ\")\n            safe_host = result.get(\"target\", \"target\").replace(\"/\", \"_\").replace(\":\", \"_\")\n            path = os.path.join(self.output_dir, f\"appmap_{safe_host}_{stamp}.json\")\n        with open(path, \"w\", encoding=\"utf-8\") as fh:\n            json.dump(result, fh, indent=2, ensure_ascii=False)\n        return path\n\n    def export_csv_summary(self, result: dict, path: Optional[str] = None) -> str:\n        \"\"\"A one-row CSV summary, handy for tracking many hosts over time.\"\"\"\n        self._ensure_dir()\n        if path is None:\n            stamp = datetime.now(timezone.utc).strftime(\"%Y%m%dT%H%M%SZ\")\n            path = os.path.join(self.output_dir, f\"appmap_summary_{stamp}.csv\")\n\n        dns = result.get(\"dns\", {}).get(\"records\", {})\n        http = result.get(\"http\", {}) or {}\n        tls = result.get(\"tls\", {}) or {}\n        row = {\n            \"target\": result.get(\"target\", \"\"),\n            \"scanned_at\": result.get(\"scanned_at\", \"\"),\n            \"a_records\": \";\".join(dns.get(\"A\", [])),\n            \"status_code\": http.get(\"status_code\", \"\"),\n            \"final_url\": http.get(\"final_url\", \"\"),\n            \"content_type\": http.get(\"content_type\", \"\"),\n            \"server\": http.get(\"server\", \"\"),\n            \"tls_version\": tls.get(\"tls_version\", \"\"),\n            \"cert_issuer\": (tls.get(\"issuer\") or {}).get(\"organizationName\", \"\"),\n            \"cert_expires\": tls.get(\"not_after\", \"\"),\n            \"days_until_expiry\": tls.get(\"days_until_expiry\", \"\"),\n        }\n        with open(path, \"w\", encoding=\"utf-8\", newline=\"\") as fh:\n            writer = csv.DictWriter(fh, fieldnames=list(row.keys()))\n            writer.writeheader()\n            writer.writerow(row)\n        return path\n", "size": 2460}, {"path": "fly.toml", "content": "# Fly.io deployment config (no Render required).\n#   fly launch --no-deploy   # creates/links the app\n#   fly deploy\n# Fly builds the included Dockerfile and gives you a public https://\u003capp>.fly.dev URL.\n# Docs: https://fly.io/docs/\n\napp = \"appmap\"\nprimary_region = \"sin\"   # Singapore - closest to India; change if you prefer\n\n[build]\n  dockerfile = \"Dockerfile\"\n\n[env]\n  APPMAP_HOST = \"0.0.0.0\"\n\n[http_service]\n  internal_port = 8000        # matches the Dockerfile / gunicorn port\n  force_https = true\n  auto_stop_machines = true   # scale to zero when idle (keeps it cheap)\n  auto_start_machines = true\n  min_machines_running = 0\n\n  [[http_service.checks]]\n    interval = \"30s\"\n    timeout = \"5s\"\n    grace_period = \"10s\"\n    method = \"GET\"\n    path = \"/api/health\"\n", "size": 770}, {"path": "graph.py", "content": "\"\"\"graph.py - build and render the AppMap relationship graph.\n\nThe graph models the chain the tool discovers:\n\n    Domain\n      -> DNS records\n      -> Web service\n      -> TLS certificate\n      -> Discovered application metadata\n\nIt is produced as a plain nested dictionary (easy to export to JSON) and can be\nrendered either as an ASCII tree for the terminal or as nodes/edges for a\ngraphical dashboard.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Dict, List\n\nfrom dns_analyzer import DNSResult, RECORD_ORDER\nfrom http_analyzer import HTTPResult\nfrom tls_analyzer import TLSResult\n\n\nclass GraphBuilder:\n    \"\"\"Turns analyzer results into a nested graph plus a node/edge view.\"\"\"\n\n    def __init__(\n        self,\n        hostname: str,\n        dns: DNSResult,\n        http: HTTPResult | None = None,\n        tls: TLSResult | None = None,\n    ):\n        self.hostname = hostname\n        self.dns = dns\n        self.http = http\n        self.tls = tls\n\n    # ------------------------------------------------------------------ #\n    # Nested dictionary form\n    # ------------------------------------------------------------------ #\n    def build(self) -> dict:\n        root = {\n            \"name\": self.hostname,\n            \"type\": \"domain\",\n            \"children\": [],\n        }\n\n        dns_node = {\"name\": \"DNS\", \"type\": \"dns\", \"children\": []}\n        for rtype in RECORD_ORDER:\n            values = self.dns.records.get(rtype, [])\n            for value in values:\n                dns_node[\"children\"].append(\n                    {\"name\": f\"{rtype} {value}\", \"type\": \"dns_record\", \"record_type\": rtype}\n                )\n        if not dns_node[\"children\"]:\n            dns_node[\"children\"].append({\"name\": \"(no records)\", \"type\": \"note\"})\n        root[\"children\"].append(dns_node)\n\n        if self.http is not None:\n            scheme = (self.http.scheme or \"http\").upper()\n            web_node = {\n                \"name\": f\"{scheme} service\",\n                \"type\": \"web_service\",\n                \"children\": [],\n            }\n            if self.http.ok:\n                web_node[\"children\"].append(\n                    {\n                        \"name\": f\"Status {self.http.status_code} {self.http.reason or ''}\".strip(),\n                        \"type\": \"http_status\",\n                    }\n                )\n                if self.http.content_type:\n                    web_node[\"children\"].append(\n                        {\"name\": f\"Content-Type: {self.http.content_type}\", \"type\": \"http_meta\"}\n                    )\n                if self.http.server:\n                    web_node[\"children\"].append(\n                        {\"name\": f\"Server: {self.http.server}\", \"type\": \"http_meta\"}\n                    )\n                for header, value in self.http.hints.items():\n                    if header == \"Server\":\n                        continue\n                    web_node[\"children\"].append(\n                        {\"name\": f\"{header}: {value}\", \"type\": \"http_meta\"}\n                    )\n            else:\n                web_node[\"children\"].append(\n                    {\"name\": f\"unavailable: {self.http.error}\", \"type\": \"note\"}\n                )\n            root[\"children\"].append(web_node)\n\n        if self.tls is not None and (self.tls.connected or self.tls.error):\n            tls_node = {\"name\": \"TLS\", \"type\": \"tls\", \"children\": []}\n            if self.tls.tls_version:\n                tls_node[\"children\"].append(\n                    {\"name\": self.tls.tls_version, \"type\": \"tls_meta\"}\n                )\n            if self.tls.subject:\n                tls_node[\"children\"].append(\n                    {\n                        \"name\": f\"subject CN={self.tls.subject.get('commonName', '?')}\",\n                        \"type\": \"tls_meta\",\n                    }\n                )\n            if self.tls.issuer:\n                tls_node[\"children\"].append(\n                    {\n                        \"name\": f\"issuer {self.tls.issuer.get('organizationName') or self.tls.issuer.get('commonName', '?')}\",\n                        \"type\": \"tls_meta\",\n                    }\n                )\n            if self.tls.days_until_expiry is not None:\n                tls_node[\"children\"].append(\n                    {\n                        \"name\": f\"expires in {self.tls.days_until_expiry} days\",\n                        \"type\": \"tls_meta\",\n                    }\n                )\n            if self.tls.sans:\n                tls_node[\"children\"].append(\n                    {\n                        \"name\": f\"SANs ({len(self.tls.sans)}): {', '.join(self.tls.sans[:5])}\"\n                        + (\" ...\" if len(self.tls.sans) > 5 else \"\"),\n                        \"type\": \"tls_meta\",\n                    }\n                )\n            if self.tls.error:\n                tls_node[\"children\"].append(\n                    {\"name\": self.tls.error, \"type\": \"note\"}\n                )\n            root[\"children\"].append(tls_node)\n\n        return root\n\n    # ------------------------------------------------------------------ #\n    # ASCII tree for the terminal\n    # ------------------------------------------------------------------ #\n    @staticmethod\n    def render_ascii(tree: dict) -> str:\n        lines: List[str] = []\n\n        def walk(node: dict, prefix: str, is_last: bool, is_root: bool = False) -> None:\n            if is_root:\n                lines.append(node[\"name\"])\n            else:\n                connector = \"\u2514\u2500\u2500 \" if is_last else \"\u251c\u2500\u2500 \"\n                lines.append(f\"{prefix}{connector}{node['name']}\")\n            children = node.get(\"children\", [])\n            if is_root:\n                child_prefix = \"\"\n            else:\n                child_prefix = prefix + (\"    \" if is_last else \"\u2502   \")\n            for i, child in enumerate(children):\n                walk(child, child_prefix, i == len(children) - 1)\n\n        walk(tree, \"\", True, is_root=True)\n        return \"\\n\".join(lines)\n\n    # ------------------------------------------------------------------ #\n    # Node/edge form for the dashboard\n    # ------------------------------------------------------------------ #\n    def build_nodes_edges(self) -> dict:\n        tree = self.build()\n        nodes: List[dict] = []\n        edges: List[dict] = []\n        counter = {\"i\": 0}\n\n        def walk(node: dict, parent_id: str | None) -> None:\n            node_id = f\"n{counter['i']}\"\n            counter[\"i\"] += 1\n            nodes.append({\"id\": node_id, \"label\": node[\"name\"], \"type\": node.get(\"type\", \"node\")})\n            if parent_id is not None:\n                edges.append({\"from\": parent_id, \"to\": node_id})\n            for child in node.get(\"children\", []):\n                walk(child, node_id)\n\n        walk(tree, None)\n        return {\"nodes\": nodes, \"edges\": edges}\n", "size": 6803}, {"path": "http_analyzer.py", "content": "\"\"\"http_analyzer.py - safe, single-request HTTP/HTTPS metadata collection.\n\nAppMap makes one ordinary GET request per scheme (following redirects, which is\nnormal browser behaviour) and records only what the server chooses to expose:\nstatus code, redirect chain, response headers, content type and any explicit\nserver/application hints. It never sends attack payloads, never attempts to\nbypass authentication, rate limits, WAFs or CAPTCHAs, and never repeats a\nrequest in a tight loop.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Dict, List, Optional\n\nimport requests\n\n# Headers that are safe and useful to surface as \"application hints\".\nHINT_HEADERS = [\n    \"Server\",\n    \"Via\",\n    \"X-Powered-By\",\n    \"X-AspNet-Version\",\n    \"X-Generator\",\n    \"X-Drupal-Cache\",\n    \"X-Backend-Server\",\n    \"X-Served-By\",\n    \"X-Cache\",\n    \"CF-Ray\",\n    \"X-Varnish\",\n]\n\nDEFAULT_USER_AGENT = \"AppMap/1.0 (+defensive metadata inspection)\"\n\n\n@dataclass\nclass RedirectHop:\n    status_code: int\n    url: str\n    location: Optional[str] = None\n\n    def as_dict(self) -> dict:\n        return {\"status_code\": self.status_code, \"url\": self.url, \"location\": self.location}\n\n\n@dataclass\nclass HTTPResult:\n    requested_url: str\n    final_url: Optional[str] = None\n    scheme: Optional[str] = None\n    status_code: Optional[int] = None\n    reason: Optional[str] = None\n    redirect_chain: List[RedirectHop] = field(default_factory=list)\n    headers: Dict[str, str] = field(default_factory=dict)\n    content_type: Optional[str] = None\n    server: Optional[str] = None\n    hints: Dict[str, str] = field(default_factory=dict)\n    tls_used: bool = False\n    elapsed_ms: Optional[float] = None\n    error: Optional[str] = None\n    ok: bool = False\n\n    def as_dict(self) -> dict:\n        return {\n            \"requested_url\": self.requested_url,\n            \"final_url\": self.final_url,\n            \"scheme\": self.scheme,\n            \"status_code\": self.status_code,\n            \"reason\": self.reason,\n            \"redirect_chain\": [h.as_dict() for h in self.redirect_chain],\n            \"headers\": self.headers,\n            \"content_type\": self.content_type,\n            \"server\": self.server,\n            \"hints\": self.hints,\n            \"tls_used\": self.tls_used,\n            \"elapsed_ms\": self.elapsed_ms,\n            \"error\": self.error,\n            \"ok\": self.ok,\n        }\n\n\nclass HTTPAnalyzer:\n    \"\"\"Issues a single, conservative HTTP request and records the metadata.\"\"\"\n\n    def __init__(self, timeout: float = 8.0, user_agent: str = DEFAULT_USER_AGENT):\n        self.timeout = timeout\n        self.user_agent = user_agent\n\n    def analyze(self, url: str) -> HTTPResult:\n        result = HTTPResult(requested_url=url)\n        headers = {\"User-Agent\": self.user_agent, \"Accept\": \"*/*\"}\n        try:\n            resp = requests.get(\n                url,\n                headers=headers,\n                timeout=self.timeout,\n                allow_redirects=True,\n                stream=True,  # we do not read the body; metadata only\n            )\n        except requests.exceptions.SSLError as exc:\n            result.error = f\"TLS/SSL error: {exc}\"\n            return result\n        except requests.exceptions.ConnectTimeout:\n            result.error = \"connection timed out\"\n            return result\n        except requests.exceptions.ReadTimeout:\n            result.error = \"read timed out\"\n            return result\n        except requests.exceptions.TooManyRedirects:\n            result.error = \"too many redirects\"\n            return result\n        except requests.exceptions.ConnectionError as exc:\n            result.error = f\"connection error: {exc}\"\n            return result\n        except requests.exceptions.MissingSchema:\n            result.error = \"invalid URL (missing scheme)\"\n            return result\n        except requests.exceptions.InvalidURL as exc:\n            result.error = f\"invalid URL: {exc}\"\n            return result\n        except requests.exceptions.RequestException as exc:\n            result.error = f\"{type(exc).__name__}: {exc}\"\n            return result\n\n        # Release the connection without downloading the body.\n        try:\n            resp.close()\n        except Exception:\n            pass\n\n        result.ok = True\n        result.final_url = resp.url\n        result.scheme = requests.utils.urlparse(resp.url).scheme\n        result.status_code = resp.status_code\n        result.reason = resp.reason\n        result.tls_used = result.scheme == \"https\"\n        result.elapsed_ms = round(resp.elapsed.total_seconds() * 1000, 1)\n\n        result.headers = {k: v for k, v in resp.headers.items()}\n        result.content_type = resp.headers.get(\"Content-Type\")\n        result.server = resp.headers.get(\"Server\")\n        result.hints = {\n            name: resp.headers[name] for name in HINT_HEADERS if name in resp.headers\n        }\n\n        for hop in resp.history:\n            result.redirect_chain.append(\n                RedirectHop(\n                    status_code=hop.status_code,\n                    url=hop.url,\n                    location=hop.headers.get(\"Location\"),\n                )\n            )\n        result.redirect_chain.append(\n            RedirectHop(status_code=resp.status_code, url=resp.url, location=None)\n        )\n        return result\n", "size": 5341}, {"path": "railway.json", "content": "{\n  \"$schema\": \"https://railway.app/railway.schema.json\",\n  \"build\": {\n    \"builder\": \"DOCKERFILE\",\n    \"dockerfilePath\": \"Dockerfile\"\n  },\n  \"deploy\": {\n    \"startCommand\": \"gunicorn -w 2 -b 0.0.0.0:${PORT:-8000} --timeout 60 dashboard:app\",\n    \"healthcheckPath\": \"/api/health\",\n    \"healthcheckTimeout\": 30,\n    \"restartPolicyType\": \"ON_FAILURE\",\n    \"restartPolicyMaxRetries\": 3\n  }\n}", "size": 388}, {"path": "requirements.txt", "content": "# AppMap runtime dependencies\n# The core CLI works with the Python standard library alone; these packages\n# add optional capabilities. Install with:  pip install -r requirements.txt\n\nrequests>=2.28      # HTTP/HTTPS metadata collection\ndnspython>=2.3      # richer DNS lookups (a built-in fallback resolver is used if absent)\nFlask>=2.2          # web interface (python dashboard.py)\ngunicorn>=20.1      # production WSGI server used when hosting the interface\n\n# Development / testing\npytest>=7.0\n", "size": 498}, {"path": "tls_analyzer.py", "content": "\"\"\"tls_analyzer.py - read-only TLS metadata inspection.\n\nOpens a normal TLS connection (the same handshake a browser performs) and reads\nthe negotiated protocol version and the peer certificate. It performs no\nmanipulation of the connection and never attempts to downgrade or attack it.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport socket\nimport ssl\nfrom dataclasses import dataclass, field\nfrom datetime import datetime, timezone\nfrom typing import List, Optional\n\n# Map ssl protocol constants to friendly names where possible.\n_TLS_VERSION_NAMES = {\n    getattr(ssl.TLSVersion, \"TLSv1\", None): \"TLS 1.0\",\n    getattr(ssl.TLSVersion, \"TLSv1_1\", None): \"TLS 1.1\",\n    getattr(ssl.TLSVersion, \"TLSv1_2\", None): \"TLS 1.2\",\n    getattr(ssl.TLSVersion, \"TLSv1_3\", None): \"TLS 1.3\",\n}\n\n\n@dataclass\nclass TLSResult:\n    hostname: str\n    port: int = 443\n    connected: bool = False\n    tls_version: Optional[str] = None\n    cipher: Optional[str] = None\n    subject: dict = field(default_factory=dict)\n    issuer: dict = field(default_factory=dict)\n    not_before: Optional[str] = None\n    not_after: Optional[str] = None\n    days_until_expiry: Optional[int] = None\n    expired: Optional[bool] = None\n    sans: List[str] = field(default_factory=list)\n    serial_number: Optional[str] = None\n    verified: Optional[bool] = None\n    error: Optional[str] = None\n\n    def as_dict(self) -> dict:\n        return {\n            \"hostname\": self.hostname,\n            \"port\": self.port,\n            \"connected\": self.connected,\n            \"tls_version\": self.tls_version,\n            \"cipher\": self.cipher,\n            \"subject\": self.subject,\n            \"issuer\": self.issuer,\n            \"not_before\": self.not_before,\n            \"not_after\": self.not_after,\n            \"days_until_expiry\": self.days_until_expiry,\n            \"expired\": self.expired,\n            \"sans\": self.sans,\n            \"serial_number\": self.serial_number,\n            \"verified\": self.verified,\n            \"error\": self.error,\n        }\n\n\ndef _flatten_name(parts) -> dict:\n    \"\"\"Turn the tuple-of-tuples returned by getpeercert into a flat dict.\"\"\"\n    out = {}\n    for rdn in parts or ():\n        for key, value in rdn:\n            out[key] = value\n    return out\n\n\ndef _parse_cert_time(value: Optional[str]) -> Optional[datetime]:\n    if not value:\n        return None\n    # Python returns e.g. 'Oct  2 12:00:00 2026 GMT'\n    try:\n        return datetime.strptime(value, \"%b %d %H:%M:%S %Y %Z\").replace(\n            tzinfo=timezone.utc\n        )\n    except ValueError:\n        return None\n\n\nclass TLSAnalyzer:\n    \"\"\"Performs a standard TLS handshake and reads the negotiated metadata.\"\"\"\n\n    def __init__(self, timeout: float = 8.0):\n        self.timeout = timeout\n\n    def analyze(self, hostname: str, port: int = 443) -> TLSResult:\n        result = TLSResult(hostname=hostname, port=port)\n\n        # Verified context first (the honest, browser-like default).\n        context = ssl.create_default_context()\n        try:\n            with socket.create_connection((hostname, port), timeout=self.timeout) as sock:\n                with context.wrap_socket(sock, server_hostname=hostname) as tls:\n                    self._populate(result, tls)\n                    result.verified = True\n                    result.connected = True\n            return result\n        except ssl.SSLCertVerificationError as exc:\n            # Certificate could not be verified. We still record what the\n            # server presented, without validating it, purely as metadata.\n            result.verified = False\n            result.error = f\"certificate verification failed: {exc.verify_message if hasattr(exc, 'verify_message') else exc}\"\n        except ssl.SSLError as exc:\n            result.error = f\"TLS error: {exc}\"\n        except socket.timeout:\n            result.error = \"TLS connection timed out\"\n        except ConnectionRefusedError:\n            result.error = \"connection refused\"\n        except socket.gaierror as exc:\n            result.error = f\"DNS resolution failed: {exc}\"\n        except OSError as exc:\n            result.error = f\"{type(exc).__name__}: {exc}\"\n\n        # Second, best-effort unverified pass to capture the presented cert.\n        try:\n            unverified = ssl._create_unverified_context()\n            with socket.create_connection((hostname, port), timeout=self.timeout) as sock:\n                with unverified.wrap_socket(sock, server_hostname=hostname) as tls:\n                    self._populate(result, tls)\n                    result.connected = True\n        except Exception:\n            pass\n        return result\n\n    @staticmethod\n    def _populate(result: TLSResult, tls: ssl.SSLSocket) -> None:\n        result.tls_version = _TLS_VERSION_NAMES.get(tls.version(), tls.version())\n        try:\n            result.cipher = tls.cipher()[0] if tls.cipher() else None\n        except Exception:\n            result.cipher = None\n\n        cert = tls.getpeercert()\n        if not cert:\n            return\n        result.subject = _flatten_name(cert.get(\"subject\"))\n        result.issuer = _flatten_name(cert.get(\"issuer\"))\n        result.serial_number = cert.get(\"serialNumber\")\n        result.sans = [value for typ, value in cert.get(\"subjectAltName\", ()) if typ == \"DNS\"]\n\n        result.not_before = cert.get(\"notBefore\")\n        result.not_after = cert.get(\"notAfter\")\n        nb = _parse_cert_time(result.not_before)\n        na = _parse_cert_time(result.not_after)\n        now = datetime.now(timezone.utc)\n        if na:\n            result.days_until_expiry = (na - now).days\n            result.expired = na \u003c now\n", "size": 5613}, {"path": ".devcontainer/README.md", "content": "# Run AppMap in GitHub Codespaces (no Render, GitHub-native)\n\n1. On the repo page: **Code \u2192 Codespaces \u2192 Create codespace on main**.\n   Dependencies install automatically from `requirements.txt`.\n2. In the Codespaces terminal:\n\n   ```bash\n   python dashboard.py\n   ```\n\n3. A notification offers to open the forwarded port. Open the **Ports** tab,\n   right-click port **5000**, and set **Port Visibility \u2192 Public** if it isn't\n   already. The forwarded `https://\u003ccodespace>-5000.app.github.dev` URL is a\n   live, working AppMap scanner (real DNS/HTTP/TLS), reachable by anyone you\n   share it with.\n\nCodespaces includes a monthly free quota; stop the codespace when you're done\nto conserve it. Note that the public URL only lives while the codespace is\nrunning.\n", "size": 767}, {"path": ".devcontainer/devcontainer.json", "content": "{\n  \"name\": \"AppMap\",\n  \"image\": \"mcr.microsoft.com/devcontainers/python:3.12\",\n  \"postCreateCommand\": \"pip install --no-cache-dir -r requirements.txt\",\n  \"forwardPorts\": [\n    5000\n  ],\n  \"portsAttributes\": {\n    \"5000\": {\n      \"label\": \"AppMap interface\",\n      \"onAutoForward\": \"openPreview\",\n      \"visibility\": \"public\"\n    }\n  },\n  \"customizations\": {\n    \"vscode\": {\n      \"extensions\": [\n        \"ms-python.python\"\n      ],\n      \"settings\": {\n        \"python.testing.pytestEnabled\": true\n      }\n    }\n  }\n}", "size": 517}, {"path": "docs/HOSTING.md", "content": "# Hosting AppMap (without Render)\n\nAppMap has two parts:\n\n- a **static interface** (HTML/CSS/JS) - hostable anywhere, including GitHub Pages;\n- a **Python backend** that does the actual DNS/HTTP/TLS work - needs a real server.\n\nGitHub Pages can only serve the static interface. To get a *working* scanner on a\npublic URL, run the backend on one of the options below. None of them require\nRender.\n\n---\n\n## Option 1 - GitHub Codespaces (GitHub-native, no other signup)\n\nThe fastest GitHub-only route. A `.devcontainer/` is included.\n\n1. Repo page \u2192 **Code \u2192 Codespaces \u2192 Create codespace on main**.\n2. In the terminal: `python dashboard.py`\n3. Open the **Ports** tab, right-click port **5000** \u2192 **Port Visibility \u2192 Public**.\n\nYou get a live `https://\u003ccodespace>-5000.app.github.dev` URL that runs the real\nscanner. The URL lives only while the codespace runs, and Codespaces has a\nmonthly free quota - stop it when you're done.\n\n---\n\n## Option 2 - a public URL from your own machine (no account at all)\n\nRun AppMap locally and expose it through a tunnel. Nothing to sign up for:\n\n```bash\npython dashboard.py            # terminal 1\n\n# terminal 2 - pick one:\ncloudflared tunnel --url http://localhost:5000     # Cloudflare quick tunnel\nssh -R 80:localhost:5000 nokey@localhost.run       # localhost.run over SSH\n```\n\nBoth print a public `https://\u2026` URL instantly. It lives only while the tunnel\nprocess runs. This is ideal for a quick demo or showing it to someone.\n\n---\n\n## Option 3 - Fly.io (Docker, free allowance)\n\nA `fly.toml` is included.\n\n```bash\nfly launch --no-deploy     # links/creates the app, reads fly.toml\nfly deploy\n```\n\nFly builds the Dockerfile and gives you `https://\u003capp>.fly.dev`. Set\n`primary_region` in `fly.toml` to the region nearest you.\n\n---\n\n## Option 4 - Railway\n\nA `railway.json` is included; Railway detects the Dockerfile.\n\n1. New Project \u2192 **Deploy from GitHub repo** \u2192 pick `appmap`.\n2. Railway builds the Dockerfile and assigns a public domain (Settings \u2192\n   Networking \u2192 Generate Domain).\n\nThe Dockerfile honours the platform's `$PORT`, so no extra config is needed.\n\n---\n\n## Option 5 - Hugging Face Spaces (Docker SDK, free, public URL)\n\n1. Create a new Space \u2192 SDK: **Docker** \u2192 Blank.\n2. Add these files to the Space repo: `Dockerfile`, `dashboard.py`,\n   `appmap.py`, `dns_analyzer.py`, `http_analyzer.py`, `tls_analyzer.py`,\n   `graph.py`, `exporter.py`, `requirements.txt`.\n3. The Space's own `README.md` needs this front-matter at the top:\n\n   ```yaml\n   ---\n   title: AppMap\n   emoji: \ud83d\udef0\ufe0f\n   colorFrom: blue\n   colorTo: indigo\n   sdk: docker\n   app_port: 8000\n   ---\n   ```\n\n   (Keep this file in the Space, separate from the project README.)\n4. Commit. The Space builds and serves a public `https://\u003cuser>-\u003cspace>.hf.space`\n   URL. Free Spaces sleep after inactivity.\n\n---\n\n## Option 6 - Any VPS or Docker host\n\n```bash\ndocker build -t appmap .\ndocker run -d -p 8000:8000 --name appmap appmap\n```\n\nPut it behind nginx/Caddy for TLS. Works on any VPS (DigitalOcean, Hetzner,\nLightsail, Oracle Cloud free tier, ...).\n\n---\n\n## A note on outbound network access\n\nAppMap makes outbound requests on behalf of whoever submits a target, so the\nhost must allow outbound **DNS (UDP/53)** and **TCP (443)**. Some free/PaaS\nplatforms restrict raw DNS or outbound sockets; there, the HTTP step still works\nthrough their proxy but DNS/TLS may report \"unavailable\". A VPS, a container\nhost with open egress, Codespaces, or a local tunnel all work fully.\n\n## Security\n\nA public deployment is reachable by anyone. Keep the authorisation notice in\nplace, and consider adding a simple access gate (HTTP basic auth or an allowlist)\nif
