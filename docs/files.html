 you don't intend it to be fully open.\n", "size": 3724}, {"path": "tests/test_dns.py", "content": "\"\"\"Tests for the DNS analyzer, including the dependency-free resolver.\"\"\"\nimport struct\n\nimport pytest\n\nfrom dns_analyzer import DNSAnalyzer, DNSResult, DNSLookupError, _MiniResolver\n\n\ndef _build_response(qid, qname, rtype_code, answers):\n    \"\"\"Build a synthetic DNS response packet.\n\n    ``answers`` is a list of (name, type, rdata_bytes) tuples.\n    \"\"\"\n    question = _MiniResolver._encode_name(qname) + struct.pack(\"!HH\", rtype_code, 1)\n    body = b\"\"\n    for name, atype, rdata in answers:\n        body += _MiniResolver._encode_name(name)\n        body += struct.pack(\"!HHIH\", atype, 1, 300, len(rdata)) + rdata\n    header = struct.pack(\"!HHHHHH\", qid, 0x8180, 1, len(answers), 0, 0)\n    return header + question + body\n\n\ndef test_encode_name_basic():\n    assert _MiniResolver._encode_name(\"example.com\") == b\"\\x07example\\x03com\\x00\"\n\n\ndef test_decode_name_roundtrip():\n    data = _MiniResolver._encode_name(\"www.example.com\")\n    name, offset = _MiniResolver._decode_name(data, 0)\n    assert name == \"www.example.com\"\n    assert offset == len(data)\n\n\ndef test_decode_name_compression_pointer():\n    base = _MiniResolver._encode_name(\"example.com\")\n    data = base + b\"\\xc0\\x00\"  # pointer to offset 0\n    name, offset = _MiniResolver._decode_name(data, len(base))\n    assert name == \"example.com\"\n    assert offset == len(base) + 2\n\n\ndef test_parse_txt_multichunk():\n    payload = b\"\\x05hello\\x05world\"\n    assert _MiniResolver._parse_txt(payload, 0, len(payload)) == \"helloworld\"\n\n\ndef test_query_unsupported_type():\n    with pytest.raises(DNSLookupError):\n        _MiniResolver().query(\"example.com\", \"SOA\")\n\n\ndef test_parse_response_a_record():\n    qid = 0x1234\n    packet = _build_response(qid, \"example.com\", 1, [(\"example.com\", 1, bytes([93, 184, 216, 34]))])\n    assert _MiniResolver()._parse_response(packet, qid) == [\"93.184.216.34\"]\n\n\ndef test_parse_response_mx_and_ns():\n    qid = 0x2222\n    mx_rdata = struct.pack(\"!H\", 10) + _MiniResolver._encode_name(\"mail.example.com\")\n    ns_rdata = _MiniResolver._encode_name(\"ns1.example.com\")\n    packet = _build_response(\n        qid,\n        \"example.com\",\n        15,\n        [(\"example.com\", 15, mx_rdata), (\"example.com\", 2, ns_rdata)],\n    )\n    values = _MiniResolver()._parse_response(packet, qid)\n    assert \"10 mail.example.com\" in values\n    assert \"ns1.example.com\" in values\n\n\ndef test_parse_response_aaaa_record():\n    qid = 0x3333\n    import ipaddress\n    rdata = ipaddress.IPv6Address(\"2606:2800:220:1::1\").packed\n    packet = _build_response(qid, \"example.com\", 28, [(\"example.com\", 28, rdata)])\n    assert _MiniResolver()._parse_response(packet, qid) == [\"2606:2800:220:1::1\"]\n\n\ndef test_parse_response_nxdomain():\n    qid = 0x4444\n    # rcode 3 (NXDOMAIN) in the low nibble of the flags\n    header = struct.pack(\"!HHHHHH\", qid, 0x8183, 1, 0, 0, 0)\n    question = _MiniResolver._encode_name(\"nope.example\") + struct.pack(\"!HH\", 1, 1)\n    with pytest.raises(DNSLookupError):\n        _MiniResolver()._parse_response(header + question, qid)\n\n\ndef test_dns_result_as_dict():\n    res = DNSResult(hostname=\"example.com\", resolver=\"builtin\")\n    res.records[\"A\"] = [\"1.2.3.4\"]\n    d = res.as_dict()\n    assert d[\"hostname\"] == \"example.com\"\n    assert d[\"records\"][\"A\"] == [\"1.2.3.4\"]\n    assert d[\"resolver\"] == \"builtin\"\n\n\ndef test_analyzer_backend_reported():\n    assert DNSAnalyzer().backend in (\"dnspython\", \"builtin\")\n", "size": 3394}, {"path": "tests/test_exporter.py", "content": "\"\"\"Tests for JSON/CSV export and TLS helpers.\"\"\"\nimport csv\nimport json\nimport os\n\nfrom exporter import Exporter\n\n\ndef _sample_result():\n    return {\n        \"target\": \"example.com\",\n        \"scanned_at\": \"2026-01-01T00:00:00+00:00\",\n        \"dns\": {\"records\": {\"A\": [\"93.184.216.34\"], \"MX\": [\"10 mail.example.com\"]}},\n        \"http\": {\n            \"status_code\": 200,\n            \"final_url\": \"https://example.com\",\n            \"content_type\": \"text/html\",\n            \"server\": \"nginx\",\n        },\n        \"tls\": {\n            \"tls_version\": \"TLS 1.3\",\n            \"issuer\": {\"organizationName\": \"Example CA\"},\n            \"not_after\": \"Jan  1 00:00:00 2027 GMT\",\n            \"days_until_expiry\": 365,\n        },\n    }\n\n\ndef test_export_json_roundtrip(tmp_path):\n    exporter = Exporter(output_dir=str(tmp_path))\n    path = exporter.export_json(_sample_result(), str(tmp_path / \"out.json\"))\n    assert os.path.isfile(path)\n    with open(path, encoding=\"utf-8\") as fh:\n        data = json.load(fh)\n    assert data[\"target\"] == \"example.com\"\n    assert data[\"dns\"][\"records\"][\"A\"] == [\"93.184.216.34\"]\n\n\ndef test_export_json_autoname(tmp_path):\n    exporter = Exporter(output_dir=str(tmp_path))\n    path = exporter.export_json(_sample_result())\n    assert path.endswith(\".json\")\n    assert \"example.com\" in os.path.basename(path)\n\n\ndef test_export_csv_summary(tmp_path):\n    exporter = Exporter(output_dir=str(tmp_path))\n    path = exporter.export_csv_summary(_sample_result(), str(tmp_path / \"s.csv\"))\n    with open(path, encoding=\"utf-8\") as fh:\n        rows = list(csv.DictReader(fh))\n    assert len(rows) == 1\n    assert rows[0][\"target\"] == \"example.com\"\n    assert rows[0][\"a_records\"] == \"93.184.216.34\"\n    assert rows[0][\"cert_issuer\"] == \"Example CA\"", "size": 1760}, {"path": "tests/test_graph.py", "content": "\"\"\"Tests for graph construction and rendering.\"\"\"\nfrom dns_analyzer import DNSResult\nfrom graph import GraphBuilder\nfrom http_analyzer import HTTPResult, RedirectHop\nfrom tls_analyzer import TLSResult\n\n\ndef _dns():\n    d = DNSResult(hostname=\"example.com\", resolver=\"builtin\")\n    d.records = {\"A\": [\"93.184.216.34\"], \"MX\": [\"10 mail.example.com\"], \"NS\": [\"ns1.example.com\"]}\n    return d\n\n\ndef _http():\n    r = HTTPResult(requested_url=\"https://example.com\")\n    r.ok = True\n    r.final_url = \"https://example.com\"\n    r.scheme = \"https\"\n    r.status_code = 200\n    r.reason = \"OK\"\n    r.content_type = \"text/html\"\n    r.server = \"nginx\"\n    r.hints = {\"X-Powered-By\": \"Express\"}\n    r.redirect_chain = [RedirectHop(200, \"https://example.com\")]\n    return r\n\n\ndef _tls():\n    r = TLSResult(hostname=\"example.com\")\n    r.connected = True\n    r.tls_version = \"TLS 1.3\"\n    r.subject = {\"commonName\": \"example.com\"}\n    r.issuer = {\"organizationName\": \"Example CA\"}\n    r.days_until_expiry = 100\n    r.sans = [\"example.com\", \"www.example.com\"]\n    r.verified = True\n    return r\n\n\ndef test_graph_build_structure():\n    tree = GraphBuilder(\"example.com\", _dns(), _http(), _tls()).build()\n    assert tree[\"name\"] == \"example.com\"\n    names = [c[\"name\"] for c in tree[\"children\"]]\n    assert \"DNS\" in names\n    assert \"HTTPS service\" in names\n    assert \"TLS\" in names\n\n\ndef test_graph_ascii_contains_nodes():\n    tree = GraphBuilder(\"example.com\", _dns(), _http(), _tls()).build()\n    ascii_tree = GraphBuilder.render_ascii(tree)\n    assert \"example.com\" in ascii_tree\n    assert \"TLS 1.3\" in ascii_tree\n    assert \"A 93.184.216.34\" in ascii_tree\n\n\ndef test_graph_nodes_edges():\n    view = GraphBuilder(\"example.com\", _dns(), _http(), _tls()).build_nodes_edges()\n    assert len(view[\"nodes\"]) == len(view[\"edges\"]) + 1  # a tree with one root\n    root = view[\"nodes\"][0]\n    assert root[\"label\"] == \"example.com\"\n\n\ndef test_graph_without_http_or_tls():\n    tree = GraphBuilder(\"example.com\", _dns()).build()\n    names = [c[\"name\"] for c in tree[\"children\"]]\n    assert names == [\"DNS\"]\n\n\ndef test_graph_handles_empty_dns():\n    d = DNSResult(hostname=\"example.com\")\n    d.records = {k: [] for k in (\"A\", \"AAAA\", \"MX\", \"NS\", \"CNAME\", \"TXT\")}\n    tree = GraphBuilder(\"example.com\", d).build()\n    dns_node = tree[\"children\"][0]\n    assert dns_node[\"children\"][0][\"name\"] == \"(no records)\"\n", "size": 2383}, {"path": "tests/test_http.py", "content": "\"\"\"Tests for the HTTP analyzer using a stubbed requests.get (no network).\"\"\"\nfrom datetime import timedelta\n\nimport pytest\nimport requests\n\nfrom http_analyzer import HTTPAnalyzer\n\n\nclass FakeResponse:\n    def __init__(self, url, status_code=200, reason=\"OK\", headers=None, history=None):\n        self.url = url\n        self.status_code = status_code\n        self.reason = reason\n        self.headers = headers or {}\n        self.history = history or []\n        self.elapsed = timedelta(milliseconds=123)\n        self.closed = False\n\n    def close(self):\n        self.closed = True\n\n\ndef test_analyze_success(monkeypatch):\n    def fake_get(url, **kwargs):\n        return FakeResponse(\n            url,\n            headers={\n                \"Content-Type\": \"text/html; charset=utf-8\",\n                \"Server\": \"nginx/1.24\",\n                \"X-Powered-By\": \"Express\",\n            },\n        )\n\n    monkeypatch.setattr(requests, \"get\", fake_get)\n    result = HTTPAnalyzer().analyze(\"https://example.com\")\n    assert result.ok\n    assert result.status_code == 200\n    assert result.content_type == \"text/html; charset=utf-8\"\n    assert result.server == \"nginx/1.24\"\n    assert result.hints[\"X-Powered-By\"] == \"Express\"\n    assert result.tls_used is True\n    assert result.elapsed_ms == 123.0\n\n\ndef test_analyze_redirect_chain(monkeypatch):\n    hop = FakeResponse(\"http://example.com\", 301, \"Moved Permanently\",\n                       headers={\"Location\": \"https://example.com\"})\n\n    def fake_get(url, **kwargs):\n        return FakeResponse(\"https://example.com\", 200, \"OK\", history=[hop])\n\n    monkeypatch.setattr(requests, \"get\", fake_get)\n    result = HTTPAnalyzer().analyze(\"http://example.com\")\n    assert len(result.redirect_chain) == 2\n    assert result.redirect_chain[0].status_code == 301\n    assert result.redirect_chain[0].location == \"https://example.com\"\n\n\n@pytest.mark.parametrize(\n    \"exc,needle\",\n    [\n        (requests.exceptions.SSLError(\"bad cert\"), \"TLS/SSL error\"),\n        (requests.exceptions.ConnectTimeout(), \"timed out\"),\n        (requests.exceptions.ConnectionError(\"refused\"), \"connection error\"),\n        (requests.exceptions.TooManyRedirects(), \"too many redirects\"),\n    ],\n)\ndef test_analyze_errors_are_graceful(monkeypatch, exc, needle):\n    def fake_get(url, **kwargs):\n        raise exc\n\n    monkeypatch.setattr(requests, \"get\", fake_get)\n    result = HTTPAnalyzer().analyze(\"https://example.com\")\n    assert result.ok is False\n    assert needle in (result.error or \"\")\n\n\ndef test_analyze_missing_schema(monkeypatch):\n    def fake_get(url, **kwargs):\n        raise requests.exceptions.MissingSchema()\n\n    monkeypatch.setattr(requests, \"get\", fake_get)\n    result = HTTPAnalyzer().analyze(\"example.com\")\n    assert result.ok is False\n    assert \"invalid URL\" in (result.error or \"\")\n", "size": 2816}, {"path": "tests/test_input.py", "content": "\"\"\"Tests for target parsing and input validation.\"\"\"\nimport pytest\n\nfrom appmap import parse_target, InputError\n\n\n@pytest.mark.parametrize(\n    \"raw,hostname\",\n    [\n        (\"example.com\", \"example.com\"),\n        (\"https://example.com\", \"example.com\"),\n        (\"http://example.com/path?q=1\", \"example.com\"),\n        (\"sub.example.co.in\", \"sub.example.co.in\"),\n        (\"example.com/foo/bar\", \"example.com\"),\n        (\"127.0.0.1\", \"127.0.0.1\"),\n        (\"  example.com  \", \"example.com\"),\n        (\"example.com.\", \"example.com\"),\n    ],\n)\ndef test_parse_target_valid(raw, hostname):\n    parsed = parse_target(raw)\n    assert parsed[\"hostname\"] == hostname\n    assert parsed[\"url\"].startswith((\"http://\", \"https://\"))\n\n\n@pytest.mark.parametrize(\n    \"raw\",\n    [\n        \"\",\n        \"   \",\n        \"exa mple.com\",\n        \"http://\",\n        \"ftp://example.com\",\n        \"-bad.example.com\",\n        \"example..com\",\n        \"a\" * 300 + \".com\",\n        \"256.1.1.1\",\n    ],\n)\ndef test_parse_target_invalid(raw):\n    with pytest.raises(InputError):\n        parse_target(raw)\n\n\ndef test_parse_target_scheme_preserved():\n    assert parse_target(\"http://example.com\")[\"scheme\"] == \"http\"\n    assert parse_target(\"https://example.com\")[\"scheme\"] == \"https\"\n    assert parse_target(\"example.com\")[\"scheme\"] == \"https\"\n", "size": 1308}, {"path": "tests/test_pipeline.py", "content": "\"\"\"End-to-end pipeline test with analyzers stubbed (no network access).\"\"\"\nfrom dns_analyzer import DNSResult\nfrom http_analyzer import HTTPResult\nfrom tls_analyzer import TLSResult\nimport appmap\n\n\ndef test_scan_pipeline(monkeypatch):\n    def fake_dns(self, hostname, record_types=None):\n        d = DNSResult(hostname=hostname, resolver=\"builtin\")\n        d.records = {\"A\": [\"93.184.216.34\"]}\n        return d\n\n    def fake_http(self, url):\n        r = HTTPResult(requested_url=url)\n        r.ok = True\n        r.final_url = url\n        r.scheme = \"https\"\n        r.status_code = 200\n        r.reason = \"OK\"\n        r.content_type = \"text/html\"\n        r.server = \"nginx\"\n        return r\n\n    def fake_tls(self, hostname, port=443):\n        r = TLSResult(hostname=hostname)\n        r.connected = True\n        r.tls_version = \"TLS 1.3\"\n        r.subject = {\"commonName\": hostname}\n        r.issuer = {\"organizationName\": \"Example CA\"}\n        r.verified = True\n        return r\n\n    monkeypatch.setattr(appmap.DNSAnalyzer, \"analyze\", fake_dns)\n    monkeypatch.setattr(appmap.HTTPAnalyzer, \"analyze\", fake_http)\n    monkeypatch.setattr(appmap.TLSAnalyzer, \"analyze\", fake_tls)\n    monkeypatch.setattr(appmap, \"INTER_REQUEST_DELAY\", 0)\n\n    result = appmap.scan(\"example.com\")\n    assert result[\"target\"] == \"example.com\"\n    assert result[\"dns\"][\"records\"][\"A\"] == [\"93.184.216.34\"]\n    assert result[\"http\"][\"status_code\"] == 200\n    assert result[\"tls\"][\"tls_version\"] == \"TLS 1.3\"\n    assert \"graph_ascii\" in result\n    assert \"example.com\" in result[\"graph_ascii\"]\n\n\ndef test_render_terminal_contains_sections(monkeypatch):\n    def fake_dns(self, hostname, record_types=None):\n        d = DNSResult(hostname=hostname, resolver=\"builtin\")\n        d.records = {\"A\": [\"1.1.1.1\"]}\n        return d\n\n    monkeypatch.setattr(appmap.DNSAnalyzer, \"analyze\", fake_dns)\n    monkeypatch.setattr(appmap, \"INTER_REQUEST_DELAY\", 0)\n    result = appmap.scan(\"example.com\", do_http=False, do_tls=False)\n    text = appmap.render_terminal(result)\n    assert \"AppMap\" in text\n    assert \"DNS\" in text\n    assert \"1.1.1.1\" in text\n", "size": 2115}, {"path": "tests/test_tls.py", "content": "\"\"\"Tests for the TLS analyzer helpers and metadata population.\"\"\"\nimport ssl\nfrom datetime import timezone\n\nfrom tls_analyzer import TLSAnalyzer, TLSResult, _flatten_name, _parse_cert_time\n\n\ndef test_flatten_name():\n    parts = (((\"commonName\", \"example.com\"),), ((\"organizationName\", \"Example Inc\"),))\n    flat = _flatten_name(parts)\n    assert flat[\"commonName\"] == \"example.com\"\n    assert flat[\"organizationName\"] == \"Example Inc\"\n\n\ndef test_flatten_name_empty():\n    assert _flatten_name(None) == {}\n    assert _flatten_name(()) == {}\n\n\ndef test_parse_cert_time():\n    dt = _parse_cert_time(\"Jan  1 00:00:00 2027 GMT\")\n    assert dt is not None\n    assert dt.tzinfo == timezone.utc\n    assert dt.year == 2027\n\n\ndef test_parse_cert_time_invalid():\n    assert _parse_cert_time(\"not a date\") is None\n    assert _parse_cert_time(None) is None\n\n\nclass FakeSSLSocket:\n    \"\"\"Mimics the parts of ssl.SSLSocket that _populate reads.\"\"\"\n\n    def __init__(self):\n        self._cert = {\n            \"subject\": (((\"commonName\", \"example.com\"),),),\n            \"issuer\": (((\"organizationName\", \"Example CA\"),),),\n            \"notBefore\": \"Jan  1 00:00:00 2026 GMT\",\n            \"notAfter\": \"Jan  1 00:00:00 2027 GMT\",\n            \"serialNumber\": \"ABCDEF\",\n            \"subjectAltName\": ((\"DNS\", \"example.com\"), (\"DNS\", \"www.example.com\")),\n        }\n\n    def version(self):\n        return ssl.TLSVersion.TLSv1_3\n\n    def cipher(self):\n        return (\"TLS_AES_128_GCM_SHA256\", \"TLSv1.3\", 128)\n\n    def getpeercert(self):\n        return self._cert\n\n\ndef test_populate_reads_certificate():\n    result = TLSResult(hostname=\"example.com\")\n    TLSAnalyzer._populate(result, FakeSSLSocket())\n    assert result.tls_version == \"TLS 1.3\"\n    assert result.cipher == \"TLS_AES_128_GCM_SHA256\"\n    assert result.subject[\"commonName\"] == \"example.com\"\n    assert result.issuer[\"organizationName\"] == \"Example CA\"\n    assert result.sans == [\"example.com\", \"www.example.com\"]\n    assert result.serial_number == \"ABCDEF\"\n    assert result.expired is False\n    assert result.days_until_expiry is not None\n\n\ndef test_analyze_handles_unreachable_host():\n    # 127.0.0.1:1 should refuse immediately, exercising the error path offline.\n    result = TLSAnalyzer(timeout=1.0).analyze(\"127.0.0.1\", port=1)\n    assert result.connected is False\n    assert result.error is not None\n", "size": 2347}];
const list = document.getElementById("list");
const content = document.getElementById("content");
const fpath = document.getElementById("fpath");
const rawlink = document.getElementById("rawlink");
const dllink = document.getElementById("dllink");
let activePath = null;

function human(n) {
  if (n < 1024) return n + " B";
  if (n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  return (n/1024/1024).toFixed(1) + " MB";
}
function groupOf(p) {
  const i = p.indexOf("/");
  if (i === -1) return "root";
  return p.slice(0, i);
}
function build(filter) {
  list.innerHTML = "";
  const f = (filter || "").toLowerCase();
  let lastGroup = null, shown = 0;
  FILES.forEach(function (file) {
    if (f && file.path.toLowerCase().indexOf(f) === -1) return;
    const g = groupOf(file.path);
    if (g !== lastGroup) {
      const h = document.createElement("div");
      h.className = "group"; h.textContent = g === "root" ? "repository root" : g + "/";
      list.appendChild(h); lastGroup = g;
    }
    const el = document.createElement("div");
    el.className = "item" + (file.path === activePath ? " active" : "");
    el.dataset.path = file.path;
    const name = document.createElement("span");
    name.textContent = file.path;
    const sz = document.createElement("span");
    sz.className = "sz"; sz.textContent = human(file.size);
    el.appendChild(name); el.appendChild(sz);
    el.addEventListener("click", function () { select(file.path); });
    list.appendChild(el);
    shown++;
  });
  if (!shown) list.innerHTML = '<div class="empty">No files match.</div>';
}
function select(path) {
  const file = FILES.find(function (x) { return x.path === path; });
  if (!file) return;
  activePath = path;
  fpath.textContent = path;
  content.textContent = file.content;
  content.scrollTop = 0;
  const url = "files/" + path;
  rawlink.href = url;
  dllink.href = url;
  dllink.setAttribute("download", path.split("/").pop());
  Array.prototype.forEach.call(document.querySelectorAll(".item"), function (it) {
    it.classList.toggle("active", it.dataset.path === path);
  });
  if (decodeURIComponent(location.hash.slice(1)) !== path) {
    location.hash = encodeURIComponent(path);
  }
}
document.getElementById("filter").addEventListener("input", function (e) { build(e.target.value); });
build("");
const initial = decodeURIComponent(location.hash.slice(1));
if (initial) select(initial);
