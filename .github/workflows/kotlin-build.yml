name: Kotlin build

on:
  push:
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin-build.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - ".github/workflows/kotlin-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and package
        # chmod guards against the executable bit being lost on the wrapper script.
        run: chmod +x gradlew && ./gradlew --no-daemon build fatJar

      - name: Upload the standalone jar
        uses: actions/upload-artifact@v4
        with:
          name: appmap-kotlin-jar
          path: kotlin/build/libs/appmap-kotlin-*-all.jar
          if-no-files-found: error
