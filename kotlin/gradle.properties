# Kept deliberately CI-safe: no environment-specific settings (proxies, paths)
# belong in a committed file. If you build behind a proxy, pass it on the
# command line instead, e.g.:
#   ./gradlew build -Dhttps.proxyHost=proxy.example -Dhttps.proxyPort=3128
#
# The memory flags below suit small/constrained machines and are harmless on CI.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Xss1m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2

# Compile Kotlin in-process so no extra compiler daemon JVM is spawned.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Xss1m
