# The sandbox caps virtual memory at 1.5 GB, which breaks the JVM's default
# 1 GB compressed-class-space reservation. These flags keep every JVM small.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Xss1m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2

# Compile Kotlin in-process so no extra compiler daemon JVM is spawned.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Xss1m

# Outbound access goes through the sandbox egress proxy.
systemProp.http.proxyHost=egress-proxy.sandbox.internal
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=egress-proxy.sandbox.internal
systemProp.https.proxyPort=3128
systemProp.http.nonProxyHosts=localhost|127.0.0.1
